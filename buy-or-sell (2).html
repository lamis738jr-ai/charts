 else if(tl.t==="arrow"){const x=X(I(tl.i)),tipY=Y(P(tl.p)),up=tl.dir==="up",len=75*clamp(a,0,1),tailY=up?tipY+len:tipY-len;g.strokeStyle=col;g.lineWidth=6;g.beginPath();g.moveTo(x,tailY);g.lineTo(x,tipY);g.stroke();head(x,tailY,x,tipY,col);lab(tl.l,clamp(x,70,470),up?tailY+24:tailY-12,col)}
 else if(tl.t==="tr"){const x1=X(I(tl.i1)),y1=Y(P(tl.p1)),x2=X(I(tl.i2)),y2=Y(P(tl.p2)),ex=x1+(x2-x1)*a,ey=y1+(y2-y1)*a;g.strokeStyle=col;g.lineWidth=4;g.setLineDash([12,8]);g.beginPath();g.moveTo(x1,y1);g.lineTo(ex,ey);g.stroke();g.setLineDash([]);lab(tl.l,clamp((x1+x2)/2+50,70,470),(y1+y2)/2+(y2<y1?30:-12),col)}
 else if(tl.t==="rr"){const x=X(I(tl.i))-slot/2,w=520-x,e=Y(lv.entry),s=Y(lv.stop),tg=Y(lv.target);g.globalAlpha=.25*clamp(a,0,1);g.fillStyle=RED;g.fillRect(x,Math.min(e,s),w,Math.abs(s-e));g.fillStyle=GREEN;g.fillRect(x,Math.min(e,tg),w,Math.abs(tg-e));g.globalAlpha=clamp(a,0,1);g.lineWidth=3;[[e,"#fff","ENTRY",lv.entry],[s,RED,"STOP LOSS",lv.stop],[tg,GREEN,"TARGET (2R)",lv.target]].forEach(([y,c,s2,pv])=>{g.strokeStyle=c;g.beginPath();g.moveTo(x,y);g.lineTo(520,y);g.stroke();lab(s2,x+6,y-7,c,"left");g.fillStyle=c;g.fillRect(470,y-11,68,22);g.fillStyle="#111";g.font='900 14px "Arial Black",sans-serif';g.textAlign="center";g.fillText(pv.toFixed(1),504,y+5)});lab("RISK 1R",460,(e+s)/2+6,RED,"right");lab("REWARD 2R",460,(e+tg)/2+6,GREEN,"right")}
 else if(tl.t==="ma"){const u=Math.min(all.length-1,I(tl.u)),end=Math.max(1,Math.floor(u*clamp(a,0,1)));g.strokeStyle=BLUE;g.lineWidth=4;g.beginPath();for(let k=0;k<=end;k++){const x=X(k),y=Y(maAt(all,k));k?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();lab(tl.l,clamp(X(end),50,500),Y(maAt(all,end))+26,BLUE)}
 else if(tl.t==="gap"){const k=lv.lastIdx,x=X(k)-10,y1=Y(maAt(all,k)),y2=Y(lv.last);g.strokeStyle=GOLD;g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();g.moveTo(x,y1);g.lineTo(x,y1+(y2-y1)*clamp(a,0,1));g.stroke();g.setLineDash([]);lab(tl.l,x-8,(y1+y2)/2,GOLD,"right")}
 g.restore()}

function draw(now){
 const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;if(playing){t+=dt;triggers()}
 g.setTransform(2,0,0,2,0,0);
 const l=LESSONS[L],TA=l.T?.7:1.2,cdn=l.cd||5,n=C.length,all=C.concat(R),slot=400/all.length,x0=16,top=240,H=560;
 const step=stepIdx>=0&&stepIdx<l.steps.length?l.steps[stepIdx]:null;
 const bg=g.createLinearGradient(0,0,0,960);bg.addColorStop(0,"#050505");bg.addColorStop(1,"#222");g.fillStyle=bg;g.fillRect(0,0,540,960);
 let vis=n*ease(t/TA);if(t>RV)vis=n+R.length*Math.min(1,(t-RV)/1.5);
 const sh=all.slice(0,Math.min(all.length,Math.max(2,Math.ceil(vis))));
 let tmin=Math.min(...sh.map(c=>c.l)),tmax=Math.max(...sh.map(c=>c.h));
 if(step&&step.tools.some(q=>q.t==="rr")){tmin=Math.min(tmin,lv.stop,lv.target,lv.entry)-.5;tmax=Math.max(tmax,lv.stop,lv.target,lv.entry)+.5}
 if(!init||!isFinite(vmin)||!isFinite(vmax)){vmin=tmin;vmax=tmax;init=true}else{vmin+=(tmin-vmin)*.12;vmax+=(tmax-vmax)*.12}
 if(vmax-vmin<.01)vmax=vmin+.01;
 const Y=p=>top+H-(p-vmin)/(vmax-vmin)*H*.9-H*.05,X=i=>x0+i*slot+slot/2;
 const shown=(t<=TA)?sh.slice(0,Math.max(0,Math.ceil(vis))):sh;
 g.font='13px system-ui,sans-serif';g.textAlign="right";for(let k=0;k<5;k++){const p=vmin+(vmax-vmin)*(.12+k*.19),y=Y(p);g.strokeStyle="rgba(255,255,255,.06)";g.lineWidth=1;g.beginPath();g.moveTo(0,y);g.lineTo(540,y);g.stroke();g.fillStyle="rgba(255,255,255,.35)";g.fillText(p.toFixed(1),536,y-3)}
 shown.forEach((c,i)=>{const x=X(i),col=c.c>=c.o?GREEN:RED,w=Math.max(3,slot*.62);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1.5;g.beginPath();g.moveTo(x,Y(c.h));g.lineTo(x,Y(c.l));g.stroke();g.fillRect(x-w/2,Math.min(Y(c.o),Y(c.c)),w,Math.max(2,Math.abs(Y(c.o)-Y(c.c))))});
 if(shown.length){const c=shown[shown.length-1],y=Y(c.c);g.fillStyle=c.c>=c.o?GREEN:RED;g.fillRect(476,y-11,62,22);g.fillStyle="#111";g.font='900 13px "Arial Black",sans-serif';g.textAlign="center";g.fillText(c.c.toFixed(1),507,y+5)}
 // teaching tools
 if(stepIdx>=0&&stepIdx<l.steps.length){for(let j=0;j<=stepIdx;j++)l.steps[j].tools.forEach(tl=>{if(j===stepIdx)tool(tl,t-stepAt-AT(tl),X,Y,all,slot);else if(tl.keep)tool(tl,99,X,Y,all,slot)})}
 if(t<RV){g.font='900 64px "Arial Black",sans-serif';const a=g.measureText("Buy ").width,b=g.measureText("or ").width,c2=g.measureText("Sell ?").width,s=(540-(a+b+c2))/2;g.textAlign="left";g.lineWidth=12;g.lineJoin="round";[["Buy ",GREEN,s],["or ","#fff",s+a],["Sell ?",RED,s+a+b]].forEach(([q,col,x])=>{g.strokeStyle="#000";g.strokeText(q,x,215);g.fillStyle=col;g.fillText(q,x,215)})}
 else txt(l.ans==="BUY"?"It was a BUY":"It was a SELL",270,215,60,l.ans==="BUY"?GREEN:RED);
 if(step&&step.badge){g.font='900 19px "Arial Black",sans-serif';const w=g.measureText(step.badge).width+30;g.fillStyle="rgba(255,213,74,.95)";g.beginPath();g.roundRect?g.roundRect(20,246,w,34,17):g.rect(20,246,w,34);g.fill();g.fillStyle="#111";g.textAlign="left";g.fillText(step.badge,35,270)}
 if(t>TA&&t<RV){const lc=C[n-1],ax=x0+n*slot+10,ay=Y(lc.c)+30,pl=.6+.4*Math.sin(t*5),a=Math.min(1,(t-TA)*2);
  [[GREEN,-1],[RED,1]].forEach(([col,d])=>{g.strokeStyle=col;g.fillStyle=col;g.lineWidth=7;g.lineCap="round";const ex=ax+75,ey=ay+d*55;const sv=(Math.sin(t*5)+1)/2,al=.2+.8*(d<0?sv:1-sv);g.globalAlpha=Math.max(0,Math.min(1,a*al));g.shadowColor=col;g.shadowBlur=22*al;g.beginPath();g.moveTo(ax,ay);g.lineTo(ex,ey);g.stroke();const an=Math.atan2(ey-ay,ex-ax);g.beginPath();g.moveTo(ex+10*Math.cos(an),ey+10*Math.sin(an));g.lineTo(ex-16*Math.cos(an-.5),ey-16*Math.sin(an-.5));g.lineTo(ex-16*Math.cos(an+.5),ey-16*Math.sin(an+.5));g.fill()});g.globalAlpha=1;g.shadowBlur=0}
 if(t>TA&&t<CD-.2)txt("you have "+cdn+" seconds",270,540,46,"#fff");
 if(t>=CD&&t<RV){const e=t-CD,num=Math.max(1,Math.ceil(cdn-e));g.fillStyle="rgba(10,10,12,.88)";g.beginPath();g.arc(270,480,150,0,7);g.fill();g.strokeStyle="#fff";g.lineWidth=9;g.shadowColor="#fff";g.shadowBlur=14;g.beginPath();g.arc(270,480,150,-Math.PI/2+.04,-Math.PI/2+(Math.PI*2-.08)*(1-e/cdn)+.04);g.stroke();g.shadowBlur=0;txt(String(num),270,535,150,"#fff")}
 if(step)wrap(step.cap,270,862,32,"#fff");
 if(t>=RV&&stepIdx<0)txt("Now let's learn why...",270,880,34,GOLD);
 if(stepIdx>=l.steps.length){txt("Follow for more",270,850,44,"#fff");txt("Educational only. Not financial advice.",270,890,20,"#aaa")}
 g.save();const vg=g.createRadialGradient(270,480,300,270,480,620);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.85)");g.fillStyle=vg;g.fillRect(0,0,540,960);g.restore();
}
function loop(now){try{draw(now)}catch(e){console.error(e)}requestAnimationFrame(loop)}

// ui
function pause(showMenu){playing=false;stopSpeech();if(showMenu)$("menu").style.display="flex"}
function start(){getAC();try{if(hasSpeech){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}catch(e){}load(L);playing=true;$("menu").style.display="none";last=performance.now()}
function showSettings(on){$("settings").style.display=on?"block":"none";if(on)pause(true)}
function openSettings(){showSettings(true);try{location.hash="settings"}catch(e){}}
function closeSettings(){showSettings(false);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
$("play").onclick=start;
$("st").onclick=openSettings;
$("back").onclick=closeSettings;
$("rp").onclick=()=>{closeSettings();start()};
$("voice").onchange=e=>{S.voice=e.target.value};
$("rate").oninput=e=>{S.rate=+e.target.value};
$("vol").oninput=e=>{S.vol=+e.target.value};
$("vo").onchange=e=>{S.vo=e.target.checked};
$("sn").onchange=e=>{S.sn=e.target.checked};
$("test").onclick=()=>{getAC();beep(880,.2,.5);say("Buy or sell? You have five seconds.")};
cv.onclick=()=>{if(playing)pause(true)};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing)pause(true)});
window.addEventListener("hashchange",()=>{showSettings(location.hash==="#settings")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&playing)pause(true)});
load(0);buildList();showSettings(location.hash==="#settings");requestAnimationFrame(loop);
})();
</script></body></html>
