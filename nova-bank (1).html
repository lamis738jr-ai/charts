<title>Nova · bank app concept</title>
<style>
:root{--c1:#2140ff;--c2:#0a0f6b;--glass:rgba(105,105,205,.42);--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--mut:rgba(255,255,255,.64);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:400 15px/1.3 "Inter",-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;justify-content:center}
button,input{font:inherit;color:inherit}
#app{position:relative;height:100%;width:100%;max-width:480px;background:linear-gradient(180deg,var(--c1) 0,var(--c2) 52%,#050816 80%);overflow:hidden}
@media (min-aspect-ratio:9/16){#app{width:calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*9/16)}}
header{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;padding:12px 16px;z-index:5;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:#f08a4b;border:0;font-weight:500;position:relative;flex:none}
.av:after{content:"";position:absolute;top:0;right:0;width:10px;height:10px;border-radius:50%;background:#ff4d4d}
.srch{flex:1;height:46px;border-radius:999px;background:var(--glass);border:0;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:500;font-size:17px;color:#fff;text-align:left}
.ib{width:46px;height:46px;border-radius:50%;background:var(--glass);border:0;display:grid;place-items:center;flex:none}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#view{position:absolute;inset:70px 0 80px;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px}
.car::-webkit-scrollbar{display:none}
.acc{flex:0 0 100%;scroll-snap-align:center;text-align:center;padding:84px 16px 4px}
.lab{color:rgba(255,255,255,.92);font-size:16px}
.amt{font-size:48px;font-weight:700;letter-spacing:-.3px;margin-top:6px;cursor:pointer}
.amt small{font-size:27px;font-weight:700}
.pill{margin-top:14px;background:var(--glass);font-size:16px;border:0;border-radius:999px;padding:10px 22px;font-weight:500}
.dots{display:flex;justify-content:center;gap:7px;margin:20px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.on{background:#fff}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;font-weight:500;font-size:14px;line-height:1.15;text-align:center}
.act b{width:54px;height:54px;border-radius:50%;background:var(--glass);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:18px;backdrop-filter:blur(8px)}
.hd{font-weight:600;font-size:16px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.row>div:nth-child(2){flex:1;min-width:0}
.ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;flex:none}
.sub{color:var(--mut);font-size:14px}.act svg{stroke-width:2.6}.pos{color:#7dffb0}
.mini{background:rgba(255,255,255,.2);border:0;border-radius:999px;padding:9px 16px;font-weight:500}
nav{position:absolute;bottom:0;left:0;right:0;height:80px;display:flex;padding:8px 8px 14px;background:linear-gradient(rgba(5,8,22,0),rgba(5,8,22,.94) 45%);z-index:5}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--mut)}
nav button.on{color:#fff}
.lg{width:24px;height:24px;display:grid;place-items:center;font-weight:800;font-size:25px;line-height:1;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
.lg span{color:inherit}
h2{margin:18px 0 0;font-size:24px;font-weight:600}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s;z-index:19}#scrim.on{opacity:1;pointer-events:auto}
#sh{position:absolute;left:0;right:0;bottom:0;background:#14182e;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s;z-index:20;max-height:86%;overflow:auto}#sh.on{transform:none}
#sh h3{margin:0 0 12px;font-size:19px;font-weight:600}
.in{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:500;font-size:17px;margin:6px 0 12px;outline:0}
.in:focus{border-color:#8fa0ff}
.btn{width:100%;border:0;border-radius:999px;padding:15px;font-weight:600;font-size:16px;background:#fff;color:#0a0f6b}
.chips{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border:1px solid transparent;border-radius:999px;padding:9px 16px;font-weight:500}.chip.on{border-color:#fff}
.bcard{border-radius:20px;padding:20px;height:190px;background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;margin-bottom:12px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}.sw.on{border-color:#fff}
#toast{position:absolute;top:84px;left:50%;transform:translate(-50%,-20px);background:#fff;color:#0a0f6b;font-weight:600;padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#ptr{position:absolute;top:84px;left:50%;width:40px;height:40px;border-radius:50%;background:var(--glass);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;pointer-events:none;z-index:4;transform:translate(-50%,-40px)}
#ptr svg{width:22px;height:22px;stroke-width:2.4}
#ptr.spin svg{animation:spin .8s linear infinite}
#app{-webkit-user-select:none;user-select:none}
.ic{overflow:hidden}.ic img{width:100%;height:100%;object-fit:cover;display:block}.in{-webkit-user-select:text;user-select:text}
@keyframes spin{to{transform:rotate(360deg)}}
.nm{font-weight:500;font-size:16px}[data-e]{cursor:pointer}
</style></head>
