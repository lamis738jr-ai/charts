const $=id=>document.getElementById(id),TS=2.6,TE=7.6,RT=[9.4,13.2,17],END=24.4;
let X=0,T=0,playing=false,speed=1,VON=true,SFX=true,AUTO=true,started=false,v=V[0],lastCap=-2,lastN=-1,rev=false,AC=null;
let saved="";try{saved=localStorage.getItem("hn")||""}catch(e){}
const fh=x=>{x=(x||"").trim();return x?(x[0]==="@"?x:"@"+x):"@yourpage"};
$("hd").textContent=fh(saved);$("hn").value=saved;
$("hn").oninput=e=>{$("hd").textContent=fh(e.target.value);try{localStorage.setItem("hn",e.target.value.trim())}catch(x){}};
function beep(f,d,ty,g){if(!SFX||!AC)return;try{const o=AC.createOscillator(),a=AC.createGain();o.type=ty||"sine";o.frequency.value=f;a.gain.setValueAtTime(g||.25,AC.currentTime);a.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const chime=ok=>{if(ok){beep(660,.25);setTimeout(()=>beep(880,.25),130);setTimeout(()=>beep(1175,.5),260)}else{beep(180,.5,"sawtooth",.2);setTimeout(()=>beep(130,.6,"sawtooth",.2),180)}};
const SS=window.speechSynthesis;let vl=[];

function lv(){if(SS)vl=SS.getVoices().filter(x=>/^en/i.test(x.lang)).sort((a,b)=>vs(b)-vs(a))}
if(SS){lv();SS.onvoiceschanged=lv}
function say(t){if(!VON||!SS)return;SS.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=Math.min(1.5,1.04*speed);u.pitch=.9;if(vl[0])u.voice=vl[0];SS.speak(u)}
function beats(){const L=v.o[v.a],G=v.g?"g":"r";return[[.3,v.c.q,"y",v.c.q],[TS,"","y",""],[TE+.2,L,G,L+"!"],[RT[0],L,G,v.r[0]],[RT[1],L,G,v.r[1]],[RT[2],L,G,v.r[2]]]}
function setVid(i){X=i;v=V[i];T=0;lastCap=-2;lastN=-1;rev=false;const a=$("app");
 a.style.setProperty("--ac","hsl("+v.c.h+" 95% 62%)");a.style.setProperty("--ad","hsl("+v.c.h+" 95% 62% / .16)");
 $("chn").textContent=v.c.e+" "+v.c.n;$("no").textContent="#"+(i+1)+" of "+V.length;$("vz").innerHTML=vis(v);$("ti").textContent=v.t;
 $("ch").innerHTML=v.ch.map(c=>"<span>"+c+"</span>").join("");$("pl").innerHTML=v.o.map((x,k)=>"<div class=\""+(v.o.length===2?(k?"b":"a"):"n")+"\">"+x+"</div>").join("");
 $("rl").innerHTML=v.r.map(r=>"<div><i>"+(v.g?"✓":"✗")+"</i><span>"+r+"</span></div>").join("");$("rl").className=v.g?"g":"r";
 $("sp").textContent=v.o[v.a]+(v.ci===6?" ✓":"");$("sp").className=v.g?"g":"r";$("eh").textContent="Follow for more "+v.c.n;
 $("sc").max=END*10;$("end").classList.remove("on");if(SS)SS.cancel();frame(0);renderSet()}
function frame(t,live){
 [...$("ch").children].forEach((c,k)=>c.classList.toggle("on",t>=.9+k*.45));
 const tm=t<TE;$("tw").classList.toggle("on",tm);$("rs").classList.toggle("on",!tm);
 const n=Math.max(1,Math.ceil(TE-t)),run=t>=TS&&t<TE;
 $("rn").textContent=t<TS?"5":n;$("rn").className=run&&n<=2?"lo":"";$("rf").style.strokeDashoffset=276.5*(1-(t<TS?1:Math.max(0,(TE-t)/5)));
 if(run&&n!==lastN&&live)beep(n===1?990:660,.12,"square",.12);lastN=run?n:-1;
 const after=t>=TE+.2;if(after&&!rev&&live)chime(v.g);rev=after;
 [...$("pl").children].forEach((d,k)=>{d.classList.toggle("ok",after&&k===v.a);d.classList.toggle("no",after&&k!==v.a)});$("card").classList.toggle("rv",!tm);
 [...$("rl").children].forEach((r,k)=>r.classList.toggle("on",t>=RT[k]));
 const B=beats();let ci=-1;B.forEach((b,i)=>{if(b[0]<=t)ci=i});
 if(ci!==lastCap){lastCap=ci;if(ci>=0){const b=B[ci];if(ci===1)lastN=-1;$("txt").className=b[2];$("txt").textContent=ci===1?"You have 5 seconds":b[1];if(live&&b[3])say(b[3])}}
 if(ci===1)$("txt").textContent=run?"Decide: "+n:"Decide now";
 $("end").classList.toggle("on",t>=END-3);$("sc").value=Math.round(t*10);$("pf").style.width=(t/END*100)+"%"}
function setPlay(p){playing=p;if(p&&AC&&AC.state==="suspended"){try{AC.resume()}catch(e){}}$("pp").innerHTML=p?"&#10074;&#10074;":"&#9654;";if(!p&&SS)SS.cancel();if(p&&T>=END){T=0;lastCap=-2;rev=false}}
