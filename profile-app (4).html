<style>
:root{--bg:#fff;--fg:#111;--mute:#8a8a8f;--chip:#f1f1f2;--red:#fe2c55;--cyan:#25f4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f4f4f4;--mute:#9a9aa0;--chip:#2a2a2d}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f4f4f4;--mute:#9a9aa0;--chip:#2a2a2d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:#050505}}
:root[data-theme="dark"] body{background:#050505}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
html,html body{height:100%;min-height:0}
html body,:root:not([data-theme="light"]) body{background:#000;display:flex;justify-content:center;padding:46px 24px 24px}
#phone{position:relative;width:100%;max-width:390px;height:min(100%,844px);align-self:center;overflow:hidden;background:var(--bg);border-radius:38px;isolation:isolate;box-shadow:0 0 0 1px #26262a,0 0 0 8px #0b0b0d}
@media (max-width:520px){html body,:root:not([data-theme="light"]) body{padding:0}#phone{max-width:none;border-radius:0;box-shadow:none}}
#screen{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative}
#screen::-webkit-scrollbar{display:none}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg)}
.status{display:none;justify-content:space-between;align-items:center;padding:12px 26px 0;height:40px;font-size:14px;font-weight:600}
.status .t{background:#34c759;color:#fff;border-radius:14px;padding:3px 11px;font-size:15px}
.status .s{display:flex;align-items:center;gap:6px;font-size:13px}
.status .b{width:25px;height:12px;border-radius:4px;border:1.5px solid var(--mute);padding:1px}.status .b:after{content:"";display:block;height:100%;width:60%;background:#ffcc00;border-radius:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
@media (max-width:500px){body{display:block;background:var(--bg)}#phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}.status{display:none}}
.top .r{display:flex;gap:18px}
svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pullwrap{position:relative;overflow:hidden}
#loader{position:absolute;left:0;right:0;top:0;height:60px;display:flex;justify-content:center;align-items:center;opacity:0}
#loader .d{position:relative;width:36px;height:16px}
#loader i{position:absolute;top:0;width:16px;height:16px;border-radius:50%}
#loader i:nth-child(1){background:var(--red);left:0;animation:red .75s ease-in-out infinite}
#loader i:nth-child(2){background:var(--cyan);left:20px;animation:cyan .75s ease-in-out infinite}
@keyframes red{0%{transform:translateX(0);z-index:2}49%{z-index:2}50%{transform:translateX(20px);z-index:1}100%{transform:translateX(0);z-index:1}}
@keyframes cyan{0%{transform:translateX(0);z-index:1}49%{z-index:1}50%{transform:translateX(-20px);z-index:2}100%{transform:translateX(0);z-index:2}}
#pull{will-change:transform;background:var(--bg);position:relative}
html,body{overscroll-behavior-y:contain}
.head{display:flex;justify-content:space-between;align-items:center;padding:8px 16px}
h1{font-size:34px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em}
.handle{color:var(--mute);margin:6px 0 14px;display:flex;align-items:center;gap:5px;font-size:15px}
.badge{width:16px;height:16px;border-radius:50%;background:#20a5f6;color:#fff;font-size:10px;display:grid;place-items:center}
.stats{display:flex;gap:28px}
.stats b{display:block;font-size:22px;font-weight:700}
.stats span{color:var(--mute);font-size:14px}
.avatar{width:96px;height:96px;border-radius:50%;flex:none;object-fit:cover}
.actions{display:flex;gap:8px;padding:16px}
.btn{height:42px;border-radius:12px;background:var(--chip);font-weight:600;flex:1}
.btn.f{background:var(--red);color:#fff;flex:1.1;transition:background .2s}
.btn.f.on{background:var(--chip);color:var(--fg)}
.btn.sq{flex:none;width:52px;display:grid;place-items:center}
.tabs{display:flex;border-bottom:1px solid var(--chip)}
.tabs button{flex:1;padding:12px;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.cell{aspect-ratio:388/421;position:relative;overflow:hidden;cursor:pointer}
.cell img{width:100%;height:100%;object-fit:cover;display:block}.cell:after{content:'';position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,#0006)}.cell .n{z-index:1;position:absolute;left:8px;bottom:8px;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;text-shadow:0 1px 3px #0008}
.cell .n svg{width:14px;height:14px;fill:#fff;stroke:none}
.empty{padding:48px 24px;text-align:center;color:var(--mute)}
.viewer{position:absolute;inset:0;background:#000;color:#fff;display:none;z-index:9}
.viewer.on{display:flex;flex-direction:column;justify-content:flex-end}
.viewer .bg{position:absolute;inset:0}
.viewer .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:2;color:#fff}
.viewer .meta{position:relative;padding:20px;background:linear-gradient(transparent,#000a)}
.viewer .side{position:absolute;right:14px;bottom:110px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:2}
.viewer .side button{color:#fff;font-size:12px;display:grid;justify-items:center;gap:2px}
.viewer .side .liked svg{fill:var(--red);stroke:var(--red)}
.toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

#chat{position:absolute;inset:0;background:#000;color:#fff;z-index:8;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
#chat.on{transform:none}
#chat svg{stroke:#fff}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;flex:none}
.ch .ava{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none}
.ch .who{flex:1;min-width:0;line-height:1.2}
.ch .who b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px}
.ch .who small{color:#a8a8a8;font-size:12px}
.ch button{display:grid;place-items:center;width:34px;height:34px}
.ch svg{width:24px;height:24px}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 10px;display:flex;flex-direction:column;gap:3px;scrollbar-width:none}
#msgs::-webkit-scrollbar{display:none}
.intro{text-align:center;padding:30px 0 6px}
.intro img{width:72px;height:72px;border-radius:50%;object-fit:cover}
.intro b{display:block;font-size:17px;margin-top:10px;font-weight:600}
.intro span{color:#a8a8a8;font-size:13px}
.ts{text-align:center;color:#8e8e8e;font-size:12px;margin:16px 0 8px}
.bb{max-width:78%;padding:10px 16px;border-radius:22px;font-size:15px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.bb.me{align-self:flex-end;background:linear-gradient(180deg,#3b52f5,#5a3ff3)}
.bb.them{background:#262626}
.mrow{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.mrow .a2{width:28px;height:28px;border-radius:50%;object-fit:cover}
.share{align-self:flex-end;width:36px;height:36px;border-radius:50%;background:#262626;display:grid;place-items:center;margin-bottom:60px}
.share svg{width:18px;height:18px}
.media{border-radius:22px;overflow:hidden;width:210px;flex:none}
.media img{width:100%;display:block}
.mr{align-self:flex-end;display:flex;gap:10px;align-items:flex-end}
.cin{flex:none;margin:6px 12px 16px;height:46px;border-radius:24px;background:#1c1c1e;display:flex;align-items:center;padding:0 14px 0 18px;gap:10px}
.cin input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:15px}
.cin input::placeholder{color:#8e8e8e}
.cin button{display:grid;place-items:center}
.cin svg{width:24px;height:24px}
#sendb{display:none;color:#6b8cff;font-weight:600;font-size:15px}
.bb{position:relative}
#side{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:14px;background:#3b52f5;color:#fff}
#side.them{background:#4a4a4d}
.bb[contenteditable]{outline:2px dashed #ffffff88;outline-offset:3px;user-select:text;-webkit-user-select:text}
.bb .x{position:absolute;top:-9px;left:-9px;width:22px;height:22px;border-radius:50%;background:#ff3b30;color:#fff;display:grid;place-items:center;font-size:14px;line-height:1;font-weight:700}
#chat .ch #done{display:none;width:auto;padding:0 6px;color:#6b8cff;font-weight:600;font-size:16px}
#chat.edit .ch #done{display:grid}
#chat.edit .ch button:not(#cback):not(#done){display:none}

const parse=v=>v==='—'?0:parseFloat(v)*(v.endsWith('M')?1e6:1);
const mk=()=>T.map((t,i)=>({id:i,src:t.src,label:t.views,views:parse(t.views),title:'Video '+(i+1)}));
let data={videos:mk(),reposts:[]},tab='videos',followed=false,followers=73300000;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600)}
function render(){
  const list=data[tab],g=$("#grid");
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">Nothing here yet.</div>';return}
  g.innerHTML=list.map(v=>`<div class="cell" data-id="${v.id}" ><img alt="" src="${v.src}"><span class="n"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>${v.label}</span></div>`).join("");
}
let cur=null,liked=new Set();
function open(id){
  cur=[...data.videos,...data.reposts].find(v=>v.id==id);
  $("#vbg").innerHTML=`<img alt="" src="${cur.src}" style="width:100%;height:100%;object-fit:cover">`;
  $("#vt").textContent=cur.title;$("#vv").textContent=cur.label+" views";
  $("#like").classList.toggle("liked",liked.has(cur.id));$("#lc").textContent=liked.has(cur.id)?"Liked":"Like";
  $("#viewer").classList.add("on");
}
$("#grid").addEventListener("click",e=>{const c=e.target.closest(".cell");if(c)open(c.dataset.id)});
$("#close").onclick=()=>$("#viewer").classList.remove("on");
$("#like").onclick=()=>{liked.has(cur.id)?liked.delete(cur.id):liked.add(cur.id);open(cur.id)};
$("#follow").onclick=e=>{followed=!followed;followers+=followed?1:-1;e.target.textContent=followed?"Following":"Follow";e.target.classList.toggle("on",followed);$("#fc").textContent=fmt(followers);toast(followed?"Followed":"Unfollowed")};
$("#msg").onclick=()=>openChat();

function openChat(){chat.classList.add("on");setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,30)}
$("#cback").onclick=()=>{setEdit(false);chat.classList.remove("on")};
function mkEd(el){el.contentEditable="true";if(el.querySelector(".x"))return;const x=document.createElement("span");x.className="x";x.contentEditable="false";x.textContent="×";x.onclick=e=>{e.stopPropagation();(el.closest(".mrow")||el).remove()};el.appendChild(x)}
function unEd(el){el.removeAttribute("contenteditable");const x=el.querySelector(".x");if(x)x.remove();if(!el.textContent.trim())(el.closest(".mrow")||el).remove()}
function setEdit(on){chat.classList.toggle("edit",on);msgs.querySelectorAll(".bb").forEach(on?mkEd:unEd);ci.placeholder=on?"Add a message...":"Message..."}
$("#done").onclick=()=>{setEdit(false);toast("Done")};
function sendMsg(){const t=ci.value.trim();if(!t)return;const th=$("#side").classList.contains("them");const d=document.createElement("div");d.className="bb "+(th?"them":"me");d.textContent=t;if(chat.classList.contains("edit"))mkEd(d);if(th){const r=document.createElement("div");r.className="mrow";const im=document.createElement("img");im.className="a2";im.src=AV;r.append(im,d);msgs.appendChild(r)}else msgs.appendChild(d);ci.value="";sync();msgs.scrollTop=msgs.scrollHeight}
$("#side").onclick=e=>{const b=e.currentTarget,th=b.classList.toggle("them");b.textContent=th?"Them":"Me";ci.placeholder=th?"Message as them...":"Message...";ci.focus()};
function sync(){const has=ci.value.trim().length>0;$("#sendb").style.display=has?"block":"none";$("#mic").style.display=has?"none":"grid";$("#stk").style.display=has?"none":"grid"}
ci.addEventListener("input",sync);ci.addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg()});$("#sendb").onclick=sendMsg;
$("#add").onclick=()=>toast("Suggested accounts not built yet");
$("#share").onclick=()=>{openChat();setEdit(true)};
$("#bell").onclick=e=>{e.currentTarget.dataset.on=e.currentTarget.dataset.on?"":"1";toast(e.currentTarget.dataset.on?"Notifications on":"Notifications off")};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");tab=b.dataset.t;render()});
// pull to refresh
const pull=$("#pull"),ld=$("#loader"),HOLD=60,TRIG=50;
let sy=null,off=0,busy=false;
function setOff(v,anim){pull.style.transition=anim?"transform .3s cubic-bezier(.2,.8,.2,1)":"none";pull.style.transform=v?`translateY(${v}px)`:"";ld.style.transition=anim?"opacity .3s":"none";ld.style.opacity=Math.min(1,v/40)}
function start(y){if(!busy&&$('#screen').scrollTop<=0&&!$("#viewer").classList.contains("on"))sy=y}
function move(y,e){if(sy===null)return;const d=y-sy;if(d>0&&$('#screen').scrollTop<=0){off=Math.min(110,d*0.45);setOff(off,false);if(e.cancelable)e.preventDefault()}else if(d<=0){off=0;setOff(0,false)}}
function end(){if(sy===null)return;sy=null;if(off>=TRIG)refresh();else{off=0;setOff(0,true)}}
const sc=$("#screen");
sc.addEventListener("touchstart",e=>start(e.touches[0].clientY),{passive:true});
sc.addEventListener("touchmove",e=>move(e.touches[0].clientY,e),{passive:false});
sc.addEventListener("touchend",end);sc.addEventListener("touchcancel",end);
sc.addEventListener("mousedown",e=>start(e.clientY));
addEventListener("mousemove",e=>{if(e.buttons)move(e.clientY,e)});
addEventListener("mouseup",end);
function refresh(){if(busy)return;busy=true;off=HOLD;setOff(HOLD,true);setTimeout(()=>{data={videos:mk(),reposts:[]};render();off=0;setOff(0,true);busy=false},1400)}
