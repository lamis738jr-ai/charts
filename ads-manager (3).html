 Math.round(38+r()*110)-.05,["Highest volume","Cost per result goal","ROAS goal"][Math.floor(r()*3)],a[8],a[9],Math.round((.94+r()*.13)*1000)/1000])}

 return{c:TG.map((t,i)=>st[SM[i]]+" | "+TG[(i+k)%12]),s:NM.s.map((_,i)=>NM.s[(i+k)%12]),a:CRE.map((_,i)=>CRE[(i+k)%12]+" | "+st[SM[i]])}}

function tot(k,list){const c=C[k];
 const s=f=>list.reduce((a,r)=>a+(r[f]||0),0);
 if(c.f&&!c.txt)return c.fmt(list.some(r=>r[c.f]!=null)?s(c.f):null);
 const T={spend:s("spend"),res:s("res"),imp:s("imp"),reach:s("reach"),clicks:s("clicks"),purch:s("purch"),val:s("val"),atc:s("atc"),leads:s("leads"),lpv:s("lpv")};
 return c.c?c.fmt(c.c(T)):"";}
function cell(r,k){const c=C[k];
 if(k==="sw")return `<td class="f"><button class="sw ${r.sw?"on":""}" aria-label="Toggle"></button></td>`;
 if(k==="dl")return `<td>${r.sw?(r.act?'<span class="dot a"></span>Active':'<span class="dot"></span>Ad set off'):'<span class="off">Off</span>'}</td>`;
 const al=c.a==="r"?"r":"";
 if(k==="bud")return `<td class="${al}"><span class="${E()}" data-f="bud" data-t="1">${r.bud||"–"}</span>${/^\$/.test(r.bud||"")?"<small>Daily</small>":""}</td>`;
 if(k==="res")return `<td class="r"><span class="${E()}" data-f="res">${nf(r.res)}</span><small class="${E()}" data-f="lbl" data-t="1">${r.lbl||"&nbsp;"}</small></td>`;
 if(c.txt)return `<td class="${al}"><span class="${E()}" data-f="${c.f}" data-t="1">${r[c.f]||"–"}</span></td>`;
 if(c.f)return `<td class="r"><span class="${E()}" data-f="${c.f}">${c.fmt(r[c.f])}</span></td>`;
 return `<td class="r">${c.fmt(c.c(r))}</td>`;}
function render(){
 const cs=cols(),q=$("#search").value.toLowerCase();
 let rs=rows().filter(r=>r.name.toLowerCase().includes(q));
 if(sort)rs=[...rs].sort((a,b)=>{const x=val(a,sort),y=val(b,sort);return((x??-Infinity)>(y??-Infinity)?1:(x??-Infinity)<(y??-Infinity)?-1:0)*(asc?1:-1)});
 const W=56+cs.reduce((a,k)=>a+C[k].w,0);
 const head=`<th class="f" style="width:56px"><span class="cb ${rs.length&&rs.every(r=>sel.has(r.id))?"on":""}" id="all"></span></th>`+
  cs.map(k=>`<th class="${C[k].a==="r"?"r":""} ${sort===k?"sel":""}" data-k="${k}" style="width:${C[k].w}px">${C[k].info?'<span class="ib"></span>':""}${C[k].h}${sort===k?(asc?" ↑":" ↓"):""}</th>`).join("");
 const body=rs.length?rs.map(r=>`<tr data-id="${r.id}" class="${sel.has(r.id)?"on":""}"><td class="f"><span class="cb ${sel.has(r.id)?"on":""}"></span></td>${cs.map(k=>cell(r,k)).join("")}</tr>`).join(""):
  `<tr><td colspan="${cs.length+1}" class="empty">No ${NAME[tab]}s. Click “Create” to add one.</td></tr>`;
 const foot=`<td></td>`+cs.map(k=>{const c=C[k];let t="";
  if(k==="name")t=`Results from ${rs.length} ${NAME[tab]}${rs.length==1?"":"s"}`;else if(k==="attr")t="Multiple attributio...";else t=tot(k,rs);
  return `<td class="${c.a==="r"?"r":""}">${t}${c.sm&&rs.length?`<small>${c.sm}</small>`:""}</td>`}).join("");
 $("#t").style.width=W+"px";
 $("#t").innerHTML=`<thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot><tr>${foot}</tr></tfoot>`;
 $(".nm").textContent=cur().label+"  ·  "+(S.p+1)+"/"+S.sets.length;
 if(mode==="set")$(".upd").textContent="Settings · page "+(S.p+1)+"/"+S.sets.length+": changes save automatically";
 $("#pub").disabled=$("#disc").disabled=!dirty;
 $("#undo").classList.toggle("d",!hist.length);
 document.querySelectorAll(".tb#del,#dup,#edit").forEach(e=>e.classList.toggle("d",!sel.size));
 save();}
// editing
$("#t").addEventListener("click",e=>{
 const tr=e.target.closest("tbody tr[data-id]");
 if(tr){if(mode!=="set")return;const r=rows().find(x=>x.id==tr.dataset.id);
  if(e.target.classList.contains("sw")){snap();r.sw=!r.sw;r.act=r.sw;render();return}
  if(e.target.classList.contains("cb")){sel.has(r.id)?sel.delete(r.id):sel.add(r.id);render();return}
  const ed=e.target.closest(".ed");if(ed&&!ed.querySelector("input"))edit(ed,r);return}
 if(e.target.id==="all"&&mode==="set"){const vis=[...document.querySelectorAll("tbody tr[data-id]")].map(t=>+t.dataset.id);
  vis.every(i=>sel.has(i))?vis.forEach(i=>sel.delete(i)):vis.forEach(i=>sel.add(i));render();return}
 const th=e.target.closest("th[data-k]");
 if(th){const k=th.dataset.k;sort===k?asc=!asc:(sort=k,asc=true);render()}
});
function edit(el,r){const f=el.dataset.f,txt=el.dataset.t,old=r[f];
 const inp=document.createElement("input");inp.className="in";inp.value=old==null?"":old;
 el.innerHTML="";el.appendChild(inp);inp.focus();inp.select();let done=false;
 const fin=ok=>{if(done)return;done=true;
  if(ok){let v=inp.value.trim();
   if(!txt){v=v.replace(/[$,%x\s]/g,"");v=v===""||v==="-"||v==="–"?null:parseFloat(v);if(v!=null&&isNaN(v))v=old}
   if(v!==old){snap();r[f]=v}}
  render()};
 inp.onkeydown=e=>{if(e.key==="Enter")fin(true);if(e.key==="Escape")fin(false);if(e.key==="Tab"){e.preventDefault();fin(true)}};
 inp.onblur=()=>fin(true);}
// toolbar
$("#create").onclick=()=>{snap();const r=blank("New "+NAME[tab]);rows().unshift(r);sort=null;sel.clear();sel.add(r.id);$("#search").value="";render();
 $("#tbl").scrollTop=0;const n=document.querySelector("tbody tr .ed[data-f=name]");if(n)n.click()};
$("#del").onclick=()=>{if(!sel.size)return;snap();cur().rows[tab]=rows().filter(r=>!sel.has(r.id));sel.clear();render()};
$("#dup").onclick=()=>{if(!sel.size)return;snap();const add=rows().filter(r=>sel.has(r.id)).map(r=>({...r,id:++uid,name:r.name+" - Copy"}));cur().rows[tab]=[...add,...rows()];sel.clear();render()};
$("#edit").onclick=()=>{if(!sel.size)return;const t=document.querySelector("tbody tr.on .ed[data-f=name]");if(t)t.click()};
$("#undo").onclick=()=>{if(!hist.length)return;S=JSON.parse(hist.pop());uid=Math.max(uid,S.uid||0);sel.clear();render()};
$("#colbtn").onclick=e=>{e.stopPropagation();if(mode!=="set")return;buildCols();$("#cols").classList.toggle("show")};
function buildCols(){$("#cols").innerHTML=`<h4>Choose columns for ${NAME[tab]}s</h4>`+Object.keys(C).filter(k=>k!=="sw").map(k=>
 `<label><input type="checkbox" data-k="${k}" ${cols().includes(k)?"checked":""}>${C[k].h}</label>`).join("")+`<div class="rs" id="rsc">Reset to default columns</div>`}
$("#cols").addEventListener("click",e=>e.stopPropagation());
$("#cols").addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;
 const keep=Object.keys(C).filter(x=>x==="sw"||(x===k?e.target.checked:cols().includes(x)));cur().cols[tab]=keep;render()});
$("#cols").addEventListener("click",e=>{if(e.target.id==="rsc"){cur().cols[tab]=[...DEF];buildCols();render()}});
document.addEventListener("click",()=>$("#cols").classList.remove("show"));
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.t;sel.clear();sort=null;
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));title();buildCols();render()});
$("#search").oninput=render;
const clr=()=>{dirty=false;render()};
$("#pub").onclick=clr;
function twoStep(el,msg,fn){if(el.dataset.armed){clearTimeout(+el.dataset.armed);el.dataset.armed="";el.innerHTML=el._h;fn();return}
 el._h=el.innerHTML;el.textContent=msg;el.dataset.armed=setTimeout(()=>{el.dataset.armed="";el.innerHTML=el._h},3000)}
$("#disc").onclick=()=>twoStep($("#disc"),"Sure?",()=>{if(hist.length){S=JSON.parse(hist[0]);hist=[];dirty=false;sel.clear();render()}});
$("#ref").onclick=()=>{$(".upd").textContent=mode==="set"?"Settings: changes save automatically":"Updated just now"};
$("#more").onclick=()=>twoStep($("#more"),"OK?",()=>{hist=[];uid=0;S=fresh();sel.clear();dirty=false;render()});
// icons
const P=(d,s)=>`<svg class="ico" viewBox="0 0 24 24" style="${s||""}">${d}</svg>`;
$("#left").innerHTML=
 `<div class="i" style="top:16px">${P('<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>')}</div>

 <div class="i" id="gridI" title="Campaigns" style="top:276px">${P('<rect x="3" y="4" width="18" height="16"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>','stroke:#1877f2')}</div>
 <div class="i" style="top:860px">${P('<path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>')}</div>
 <div class="i" style="top:905px">${P('<path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/>')}<span class="badge" style="left:24px;top:2px;min-width:30px">98</span></div>
 <div class="i" style="top:950px">${P('<circle cx="10" cy="10" r="7"/><path d="M15 15l6 6"/>')}</div>
 <div class="i" id="helpI" title="Next page" style="top:992px">${P('<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 116 0c0 2-3 2-3 5M12 17v1"/>')}</div>
 <div class="i" id="gearI" title="Settings" style="top:1036px">${P('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/>')}</div>`;
$("#right").innerHTML=`<div class="sel"></div>
 <div class="i" style="top:0px">${P('<path d="M5 5l14 14M19 5L5 19"/>')}</div>
 <div class="i" style="top:72px">${P('<path d="M5 20V10M12 20V4M19 20v-8"/>')}</div>
 <div class="i" style="top:128px">${P('<path d="M4 20l1-5L16 4l4 4L9 19z"/>')}</div>
 <div class="i" style="top:180px">${P('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')}</div>
 <div class="i" style="top:234px">${P('<circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/>')}</div>`;
$("#ref").innerHTML=P('<path d="M20 12a8 8 0 11-3-6M20 4v5h-5"/>');
const TN={c:"Campaigns",s:"Ad sets",a:"Ads"};
function title(){$("#top h2").textContent=mode==="set"?"Settings: "+TN[tab]:TN[tab]}
function setMode(m){mode=m;sel.clear();document.body.classList.toggle("set",m==="set");title();
 $("#gridI svg").style.stroke=m==="view"?"#1877f2":"#1c1e21";$("#gearI svg").style.stroke=m==="set"?"#1877f2":"#1c1e21";
 $(".upd").textContent=m==="set"?"Settings: changes save automatically":"Updated just now";$("#cols").classList.remove("show");render()}
$("#done").onclick=()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();setMode("view")};
$("#helpI").onclick=()=>{S.p=(S.p+1)%S.sets.length;sel.clear();sort=null;$("#search").value="";buildCols();$("#tbl").scrollTop=0;render()};
$("#gearI").onclick=()=>setMode("set");$("#gridI").onclick=()=>setMode("view");
const app=$("#app");
function fit(){const s=innerWidth/1840;app.style.transform=`scale(${s})`;document.body.style.height=(1100*s)+"px"}
addEventListener("resize",fit);fit();buildCols();setMode("view");
</script>
