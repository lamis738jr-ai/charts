<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beacon Studio (Demo)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0b0c;--card:#171719;--rule:#2a2a2e;--ink:#f2f2f4;--mut:#a4a4ac;--acc:#ff5a3c;--ok:#4cd16f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;margin:0;background:#000;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
body{display:flex;justify-content:center}
button,input,select{font:inherit;color:inherit}
#app{opacity:0;transition:opacity .15s;width:100%;max-width:460px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.note{font-size:12px;color:#ffd479;border:1px solid #6b5521;border-radius:10px;padding:6px 10px;margin:0 0 12px;line-height:1.4}
#open{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;background:var(--acc);color:#fff}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 0;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:700;letter-spacing:-.3px}
#logo{width:34px;height:26px;border-radius:7px;background:var(--acc);display:grid;place-items:center;font-size:13px;font-weight:700;overflow:hidden;color:#fff}
#logo img{width:100%;height:100%;object-fit:cover}
.icons{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border:0;background:none;border-radius:50%;display:grid;place-items:center;font-size:20px}
.ib:active{background:#222}
#ch{width:32px;height:32px;border-radius:50%;background:#555;display:grid;place-items:center;font-size:13px;font-weight:700;overflow:hidden}
#ch img{width:100%;height:100%;object-fit:cover}
nav.tabs{display:flex;gap:22px;padding:12px 16px 0;border-bottom:1px solid var(--rule);flex:none;overflow:hidden}
nav.tabs span{padding-bottom:10px;font-size:15px;font-weight:500;color:var(--mut);white-space:nowrap}
nav.tabs span.on{color:var(--ink);font-weight:700;border-bottom:3px solid var(--ink)}
main{flex:1;min-height:0;overflow:auto;overscroll-behavior-y:contain;padding:14px 0 90px}
#car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:0 16px;scrollbar-width:none}
#car::-webkit-scrollbar{display:none}
.card{flex:0 0 88%;scroll-snap-align:center;background:var(--card);border-radius:18px;padding:16px;border:1px solid #202024}
.card small{color:var(--mut);font-size:13px}
.card b{display:block;font-size:21px;font-weight:500;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.chart{display:flex;gap:6px}
.yl{display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--mut);height:96px;padding:2px 0}
.plot{flex:1;position:relative;height:96px;touch-action:none;-webkit-user-select:none;user-select:none}
.plot svg{display:block;width:100%;height:96px}
.cd{position:absolute;width:16px;height:16px;border-radius:50%;background:#7fd0d0;border:3px solid #fff;margin:-8px 0 0 -8px;display:none;pointer-events:none;box-shadow:0 0 0 1px #0007}
.ct{position:absolute;top:2px;display:none;pointer-events:none;font-size:12.5px;line-height:1.35;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 2px #000;z-index:2}
.ct b{display:block;font-size:15px;font-weight:700;color:#fff}
.ct span{color:#dcdce2}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:6px 0 0 34px}
.dots{display:flex;justify-content:center;gap:8px;padding:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#444}.dots i.on{background:#fff}
.sec{margin:0 16px 14px;background:var(--card);border-radius:18px;padding:16px;border:1px solid #202024}
.sec h3{margin:0;font-size:17px}.sec p{margin:2px 0 12px;color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.th{width:64px;height:36px;border-radius:6px;flex:none;background-size:cover;background-position:center}
.row span{flex:1;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row em{font-style:normal;font-size:13.5px;font-weight:500}
.rt{display:flex;justify-content:space-between;align-items:flex-end}
.rt b{font-size:21px;font-weight:500}
#bars{display:flex;align-items:flex-end;gap:2px;height:46px;width:46%}
#bars i{flex:1;background:#3b9eff;border-radius:1px}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#0f0f11;border-top:1px solid var(--rule);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--mut)}
footer div{text-align:center}footer div span{display:block;font-size:20px}footer .on{color:var(--ink)}
#sheet{position:absolute;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
#sheet.open{display:flex}
#panel{background:#1c1c1f;width:100%;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 28px}
#panel h2{margin:0 0 4px;font-size:18px}
#panel h4{margin:16px 0 6px;font-size:12px;letter-spacing:.6px;color:var(--mut);text-transform:uppercase}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;background:#0f0f11;border:1px solid #333;border-radius:10px;padding:10px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700;background:#333}
.btns .pri{background:var(--acc);color:#fff}
#app.ready{opacity:1}
footer{color:#d4d4da}
footer div{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
footer svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
footer .on{color:#fff}
/* pull-to-refresh lives inside each section, under the tabs */
main{-webkit-user-select:none;user-select:none}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;transition:height .2s}
#ptr.drag{transition:none}
#ptr svg{display:block;width:28px;height:28px}
#ptr.spin svg{animation:ptrsp .8s linear infinite}
@keyframes ptrsp{to{transform:rotate(360deg)}}
</style>
<noscript><style>#app{opacity:1}</style></noscript>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><div id="logo"></div><span id="bn"></span></div>
    <div class="icons"><button class="ib">⊕</button><button class="ib">🔔</button><div id="ch"></div></div>
  </header>
  <nav class="tabs"><span class="on">Overview</span><span>Content</span><span>Audience</span><span>Revenue</span><span>Trends</span></nav>
  <main>
    <div id="ptr"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#e8e8ea" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="42 15"/></svg></div>

    <div class="sec"><h3>Top content</h3><p>Views · Last 28 days</p><div id="top"></div></div>

  <footer>

    <div><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="2.7"/><path d="M7.4 18.6c0-2.7 2-4.3 4.6-4.3s4.6 1.6 4.6 4.3"/><circle cx="5.4" cy="9.6" r="2"/><path d="M2.4 17.2c0-1.8 1.2-3.1 3-3.2"/><circle cx="18.6" cy="9.6" r="2"/><path d="M21.6 17.2c0-1.8-1.2-3.1-3-3.2"/></svg>Community</div>
    <div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><text x="12" y="16.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor" stroke="none" font-family="-apple-system,Arial">$</text></svg>Earn</div>
  </footer>
  <div id="sheet"><div id="panel"></div></div>
</div>

function rnd(seed){var x=seed*9301+49297;return function(){x=(x*9301+49297)%233280;return x/233280}}
function series(shape,seed){var r=rnd(seed),n=32,a=[],v=.5;
 for(var i=0;i<n;i++){var t=i/(n-1),b;
  if(shape=="flat")b=.45+(r()-.5)*.18;
  else if(shape=="wavy")b=.45+Math.sin(t*9+seed)*.22+(r()-.5)*.3;
  else if(shape=="decline")b=.7-t*.35+(r()-.5)*.15+(t>.55?-.12:0);
  else if(shape=="rise")b=.2+t*.55+(r()-.5)*.14;
  else if(shape=="cliff")b=t>.93?.5-(t-.93)*7:.58+(r()-.5)*.06+Math.sin(t*5)*.04;
  else b=.5+(r()-.5)*.5;
  a.push(Math.max(.03,Math.min(.97,b)))}
 return a}
function chart(c,ci){var a=series(c.shape,c.seed),w=300,h=96,

 var grid="";[0,1,2,3].forEach(function(i){var y=4+i*(h-8)/3;grid+='<line x1="0" x2="'+w+'" y1="'+y+'" y2="'+y+'" stroke="#2f2f34" stroke-width="1"/>'});
 var yl=c.yl.map(function(t){return "<span>"+esc(t)+"</span>"}).join("");
 return '<div class="chart"><div class="yl">'+yl+'</div><div class="plot" data-ci="'+ci+'"><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+grid+'<polyline points="'+pts+'" fill="none" stroke="#bfe6ff" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg><div class="cd"></div><div class="ct"></div></div></div>'}

function showAt(p,clientX){
 var c=D.cards[+p.getAttribute("data-ci")];if(!c)return;
 var a=series(c.shape,c.seed),r=p.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,clientX-r.left)),
 i=Math.round(x/r.width*(a.length-1)),px=i/(a.length-1)*r.width,py=(1-a[i])*r.height,
 cd=p.querySelector(".cd"),ct=p.querySelector(".ct");
 cd.style.display=ct.style.display="block";
 cd.style.left=px+"px";cd.style.top=py+"px";
 ct.innerHTML="<b>"+esc(dateAt(i,a.length))+"</b><span>Value: "+esc(fmtVal(c,a,i))+"</span>";
 if(px>r.width*0.5){ct.style.left="auto";ct.style.right=(r.width-px+12)+"px";ct.style.textAlign="right"}
 else{ct.style.right="auto";ct.style.left=(px+12)+"px";ct.style.textAlign="left"}}
var carEl0=document.getElementById("car");
carEl0.addEventListener("pointerdown",function(e){var p=e.target.closest(".plot");if(!p)return;clearTimeout(scrub.t);hidePlot(scrub.el);scrub.el=p;try{p.setPointerCapture(e.pointerId)}catch(_){}showAt(p,e.clientX)});
carEl0.addEventListener("pointermove",function(e){if(scrub.el){showAt(scrub.el,e.clientX)}else if(e.pointerType==="mouse"){var p=e.target.closest(".plot");if(p)showAt(p,e.clientX)}});
function endScrub(){var p=scrub.el;scrub.el=null;clearTimeout(scrub.t);scrub.t=setTimeout(function(){hidePlot(p)},1500)}
carEl0.addEventListener("pointerup",endScrub);carEl0.addEventListener("pointercancel",endScrub);
carEl0.addEventListener("mouseout",function(e){if(!scrub.el&&e.target.closest&&e.target.closest(".plot")&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest(".plot")))hidePlot(e.target.closest(".plot"))});
document.getElementById("open").onclick=openSheet;
/* ---- remember where you were (card, tabs, scroll) across refresh ---- */
var UK="beacon-ui-v1",U={card:0,tab:0,foot:0,y:0};
try{var u0=localStorage.getItem(UK);if(u0)U=Object.assign(U,JSON.parse(u0))}catch(e){}
function saveU(){try{localStorage.setItem(UK,JSON.stringify(U))}catch(e){}}
var carEl=document.getElementById("car"),mainEl=document.querySelector("main");
var tabEls=document.querySelectorAll("nav.tabs span"),footEls=document.querySelectorAll("footer div");
function mark(list,idx){Array.prototype.forEach.call(list,function(el,k){el.classList.toggle("on",k===idx)})}
mark(tabEls,U.tab);mark(footEls,U.foot);
Array.prototype.forEach.call(tabEls,function(el,k){el.addEventListener("click",function(){U.tab=k;mark(tabEls,k);saveU()})});
Array.prototype.forEach.call(footEls,function(el,k){el.addEventListener("click",function(){U.foot=k;mark(footEls,k);saveU()})});
function cardW(){return carEl.firstChild?carEl.firstChild.offsetWidth+10:1}
var t1,t2;
carEl.addEventListener("scroll",function(){clearTimeout(t1);t1=setTimeout(function(){U.card=Math.max(0,Math.min(D.cards.length-1,Math.round(carEl.scrollLeft/cardW())));saveU()},150)});
mainEl.addEventListener("scroll",function(){clearTimeout(t2);t2=setTimeout(function(){U.y=mainEl.scrollTop;saveU()},150)});
function restore(){carEl.style.scrollBehavior="auto";carEl.scrollLeft=Math.min(U.card,D.cards.length-1)*cardW();dots();mainEl.scrollTop=U.y}
render();
restore();
requestAnimationFrame(function(){restore();document.getElementById("app").classList.add("ready")});
setTimeout(restore,150);
setTimeout(function(){document.getElementById("app").classList.add("ready")},600);
/* ---- pull-to-refresh inside the section (spinner sits under the tabs) ---- */
var ptr=document.getElementById("ptr"),ptrSv=ptr.firstElementChild,pY=0,pX=0,pDy=0,pOn=false,pBusy=false,pDec=false,pVert=false;
mainEl.addEventListener("touchstart",function(e){
  if(pBusy||mainEl.scrollTop>0||(e.target.closest&&e.target.closest(".plot")))return;
  pY=e.touches[0].clientY;pX=e.touches[0].clientX;pOn=true;pDec=false;pVert=false;pDy=0;ptr.classList.add("drag");
},{passive:true});
mainEl.addEventListener("touchmove",function(e){
  if(!pOn)return;
  var dy=e.touches[0].clientY-pY,dx=e.touches[0].clientX-pX;
  if(!pDec){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;pDec=true;pVert=dy>0&&Math.abs(dy)>Math.abs(dx);}
  if(!pVert||mainEl.scrollTop>0){pOn=false;ptr.classList.remove("drag");ptr.style.height="0px";return;}
  pDy=dy;ptr.style.height=Math.min(78,dy*.5)+"px";ptrSv.style.transform="rotate("+(dy*2.2)+"deg)";
  if(e.cancelable)e.preventDefault();
},{passive:false});
function endPull(){
  if(!pOn)return;pOn=false;ptr.classList.remove("drag");
  if(pDy*.5>=56)doRefresh();else ptr.style.height="0px";
}
mainEl.addEventListener("touchend",endPull);mainEl.addEventListener("touchcancel",endPull);
function doRefresh(){
  pBusy=true;ptr.style.height="64px";ptrSv.style.transform="";ptr.classList.add("spin");
  setTimeout(function(){
    try{render();carEl.style.scrollBehavior="auto";carEl.scrollLeft=Math.min(U.card,D.cards.length-1)*cardW();dots();}catch(e){}
    ptr.classList.remove("spin");ptr.style.height="0px";pBusy=false;
  },1100);
}
/* mouse drag = same pull-to-refresh on desktop */
(function(){var md=false,my=0;
mainEl.addEventListener("mousedown",function(e){if(pBusy||mainEl.scrollTop>0||e.target.closest(".plot,input,select,button"))return;md=true;my=e.clientY;pDy=0;ptr.classList.add("drag")});
window.addEventListener("mousemove",function(e){if(!md)return;var dy=e.clientY-my;if(dy<=0||mainEl.scrollTop>0){pDy=0;ptr.style.height="0px";return}pDy=dy;ptr.style.height=Math.min(78,dy*.5)+"px";ptrSv.style.transform="rotate("+(dy*2.2)+"deg)"});
window.addEventListener("mouseup",function(){if(!md)return;md=false;ptr.classList.remove("drag");if(pDy*.5>=56)doRefresh();else ptr.style.height="0px"});})();
window.addEventListener("pagehide",saveU);
</script>
</body>
</html>
