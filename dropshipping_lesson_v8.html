w(0,"RIFF");d.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,44100,true);d.setUint32(28,88200,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,n*2,true);
return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
function unlockAudio(){ensureAudio();
 try{if(!keep){keep=new Audio(silentUrl());keep.loop=true;keep.setAttribute("playsinline","");keep.volume=1}const pr=keep.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
 try{if(AC){const b=AC.createBuffer(1,1,22050),o=AC.createBufferSource();o.buffer=b;o.connect(AC.destination);o.start(0)}}catch(e){}
 if(SS){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;SS.speak(u)}catch(e){}try{lv()}catch(e){}}}
["touchend","click"].forEach(ev=>addEventListener(ev,()=>{if(started){ensureAudio();if(keep&&keep.paused){try{keep.play().catch(()=>{})}catch(e){}}}},{passive:true}));

let tk=0;
function timerSound(n){
 if(n===5){beep(520,.12,"triangle",.3);setTimeout(()=>beep(780,.12,"triangle",.3),110);setTimeout(()=>beep(1040,.25,"triangle",.3),220);return}
 tk++;
 if(n<=2){beep(1000,.09,"square",.22);setTimeout(()=>beep(1000,.09,"square",.22),160);return}
 beep(tk%2?900:650,.07,"square",.2);
}
const chime=ok=>{if(ok){beep(660,.25);setTimeout(()=>beep(880,.25),130);setTimeout(()=>beep(1175,.5),260)}else{beep(180,.5,"sawtooth",.2);setTimeout(()=>beep(130,.6,"sawtooth",.2),180)}};
const SS=window.speechSynthesis;let vl=[];
const vs=x=>isMob?((x.localService?40:0)+(/en[-_]US/i.test(x.lang)?6:0)+(/enhanced|premium|siri|samantha|google us/i.test(x.name)?10:0)-(/novelty|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph/i.test(x.name)?100:0)):((/natural|neural|online|premium|enhanced|siri/i.test(x.name)?50:0)+(/google/i.test(x.name)?20:0)+(/en[-_]US/i.test(x.lang)?4:0));
function lv(){if(SS)vl=SS.getVoices().filter(x=>/^en/i.test(x.lang)).sort((a,b)=>vs(b)-vs(a))}
if(SS){lv();SS.onvoiceschanged=lv}
const est=n=>n/(14*Math.min(1.5,speed));
const sp=t=>String(t).replace(/(\d)x\b/g,"$1 times").replace(/\s+/g," ");
const endp=t=>/[.!?]$/.test(t)?t:t+".";
function stopSpeech(){tok++;isp=rsp=false;if(SS){try{SS.cancel()}catch(e){}}}
function speak(txt,onstart,onend,onb){if(!(VON&&SS))return false;
 const my=tok;let done=false,started=false,retried=false,wd=0;
 const fin=()=>{if(done)return;done=true;clearTimeout(wd);if(my===tok&&onend)onend()};
 const arm=()=>{clearTimeout(wd);wd=setTimeout(function w(){if(done||my!==tok)return;if(!playing){wd=setTimeout(w,1000);return}try{SS.cancel()}catch(e){}fin()},(txt.length/(11*Math.min(1.5,speed))+3.5)*1000)};
 const go=useVoice=>{const u=new SpeechSynthesisUtterance(txt);u.rate=Math.min(1.5,speed);u.pitch=1;u.volume=1;u.lang="en-US";
  if(useVoice&&vl[0]){u.voice=vl[0];u.lang=vl[0].lang||"en-US"}
  u.onstart=()=>{if(my!==tok||done)return;started=true;arm();if(onstart)onstart()};
  u.onend=()=>fin();
  u.onerror=e=>{if(my!==tok||done)return;const er=e&&e.error;if(er==="interrupted"||er==="canceled")return;if(!started&&!retried){retried=true;setTimeout(()=>{if(my===tok&&!done)go(false)},50)}else fin()};
  u.onboundary=e=>{if(my===tok&&onb)onb(e)};
  try{SS.speak(u)}catch(e){fin()}};
 arm();
 setTimeout(()=>{if(my!==tok||done)return;try{if(SS.paused)SS.resume()}catch(e){}go(true)},80);
 return true}
function introText(){const q=v.c.q;return sp(endp(q)+" You've got 5 seconds to answer.")}
function revealText(){const L=v.o[v.a];let lead=v.ci===5?"The red flag is "+L+".":v.ci===6?"The best price is "+L+".":L.charAt(0)+L.slice(1).toLowerCase()+"!";
 let t=sp(lead);const off=[];v.r.forEach(r=>{t+=" ";off.push(t.length);t+=sp(endp(r))});return{t,off}}
function estReveal(base){const r=revealText();RT=r.off.map(o=>base+est(o));END=base+est(r.t.length)+.3;return r}
function estimates(){TS=.1+est(introText().length)+.25;TE=TS+5;estReveal(TE+.25)}
function resetNarr(){stopSpeech();stage=0;estimates()}
function startIntro(){speak(introText(),()=>{isp=true},()=>{isp=false;if(stage<2){TS=T;TE=T+5;estReveal(TE+.25)}})}
function startReveal(){const r=estReveal(T);speak(r.t,()=>{rsp=true},()=>{rsp=false;END=T+.3;RT=RT.map(x=>Math.min(x,T))},e=>{if(e.name&&e.name!=="word")return;r.off.forEach((o,k)=>{if(e.charIndex>=o&&RT[k]>T)RT[k]=T})})}
function narrate(){if(stage<1&&T>=.1){stage=1;startIntro()}if(stage<2&&T>=TE+.25){stage=2;startReveal()}}
function beats(){const L=v.o[v.a],G=v.g?"g":"r";return[[.1,v.c.q,"y",v.c.q+". You've got 5 seconds to answer."],[Math.max(1.2,TS-1.6),"You have 5 seconds","y",""],[TS,"","y",""],[TE+.2,L,G,L+"!"],[RT[0],L,G,v.r[0]],[RT[1],L,G,v.r[1]],[RT[2],L,G,v.r[2]]]}
function setVid(i){X=i;v=V[i];T=0;lastCap=-2;lastN=-1;rev=false;const a=$("app");
 a.style.setProperty("--ac","hsl("+v.c.h+" 95% 62%)");a.style.setProperty("--ad","hsl("+v.c.h+" 95% 62% / .16)");
 $("chn").textContent=v.c.e+" "+v.c.n;$("no").textContent="#"+(i+1)+" of "+V.length;$("vz").innerHTML=vis(v);$("vz").style.height=(v.ci===0||v.ci===1||v.ci===6)?"clamp(150px,22vh,200px)":"";$("ti").textContent=v.t;
 $("ch").innerHTML=v.ch.map(c=>"<span>"+c+"</span>").join("");$("pl").innerHTML=v.o.map((x,k)=>"<div class=\""+(v.o.length===2?(k?"b":"a"):"n")+"\">"+x+"</div>").join("");
 $("rl").innerHTML=v.r.map(r=>"<div><i>"+(v.g?"✓":"✗")+"</i><span>"+r+"</span></div>").join("");$("rl").className=v.g?"g":"r";
 $("sp").textContent=v.o[v.a]+(v.ci===6?" ✓":"");$("sp").className=v.g?"g":"r";$("eh").textContent="Follow for more "+v.c.n;
 $("sc").max=300;$("end").classList.remove("on");resetNarr();frame(0);renderSet()}
function frame(t,live){
 [...$("ch").children].forEach((c,k)=>c.classList.toggle("on",t>=.9+k*.45));
 const tm=t<TE;$("tw").classList.toggle("on",tm);$("rs").classList.toggle("on",!tm);
 const n=Math.max(1,Math.ceil(TE-t)),run=t>=TS&&t<TE;
 $("rn").textContent=t<TS?"5":n;$("rn").className=run&&n<=2?"lo":"";$("rf").style.strokeDashoffset=276.5*(1-(t<TS?1:Math.max(0,(TE-t)/5)));
 if(run&&n!==lastN&&live)timerSound(n);lastN=run?n:-1;
 const after=t>=TE+.2;if(after&&!rev&&live)chime(v.g);rev=after;
 [...$("pl").children].forEach((d,k)=>{d.classList.toggle("ok",after&&k===v.a);d.classList.toggle("no",after&&k!==v.a)});$("card").classList.toggle("rv",!tm);
 [...$("rl").children].forEach((r,k)=>r.classList.toggle("on",t>=RT[k]));
 const B=beats();let ci=-1;B.forEach((b,i)=>{if(b[0]<=t)ci=i});
 if(ci!==lastCap){lastCap=ci;if(ci>=0){const b=B[ci];$("txt").className=b[2];$("txt").textContent=b[1];}}
 if(ci===2)$("txt").textContent=run?"Decide: "+n:"Decide now";
 $("end").classList.toggle("on",t>=END-3&&X===V.length-1);$("sc").value=Math.round(t*10);$("pf").style.width=(t/END*100)+"%"}
function setPlay(p){playing=p;if(p)ensureAudio();$("pp").innerHTML=p?"&#10074;&#10074;":"&#9654;";if(SS){try{if(p)SS.resume();else SS.pause()}catch(e){}}if(p&&T>=END){T=0;lastCap=-2;rev=false;resetNarr()}}

function renderSet(){let h="",pc=-1;V.forEach((x,i)=>{if(x.c!==pc){pc=x.c;h+="<h3>"+x.c.e+" "+x.c.n+"</h3>"}h+='<button class="btn v'+(i===X?" a":"")+'" data-i="'+i+'">'+x.e+" "+x.t+"</button>"});$("vl").innerHTML=h;
 $("spd").innerHTML=[1,1.25,1.5].map(n=>'<button class="btn'+(n===speed?" a":"")+'" data-s="'+n+'">'+n+"x</button>").join("")}
$("set").onclick=e=>{const b=e.target.closest("button.v"),s=e.target.closest("button[data-s]");if(b){setVid(+b.dataset.i);closeSet(true)}else if(s){speed=+s.dataset.s;renderSet()}else if(e.target.id==="vo"){VON=e.target.checked;if(!VON)stopSpeech()}else if(e.target.id==="sf")SFX=e.target.checked;else if(e.target.id==="au")AUTO=e.target.checked};

$("gr").onclick=openSet;$("cl").onclick=()=>closeSet(false);

$("pp").onclick=()=>setPlay(!playing);$("mid").onclick=$("card").onclick=()=>{if(started)setPlay(!playing)};
function setSnd(on){VON=SFX=on;$("sn").textContent=on?"🔊":"🔇";$("vo").checked=on;$("sf").checked=on;if(!on)stopSpeech();if(on){unlockAudio();beep(880,.15)}}
