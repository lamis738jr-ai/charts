function r(n){return Math.floor(Math.random()*n)}

function pad(n){return (n<10?"0":"")+n}
function change(){
  var hh=r(24),mm=r(60);
  document.getElementById("time").textContent=pad(hh)+":"+pad(mm);
  var chg=Math.random()<0.5;
  var pct=chg?10+r(86):5+r(16);

  b.style.width=pct+"%";
  b.style.background=chg?"#30d158":"#ffd60a";
  document.getElementById("batt").classList.toggle("chg",chg);
  
  av0();document.getElementById("title").textContent=pick();
  var cl=CV[curLang];var c=cl[r(cl.length)];
  var t=hh*60+mm-c.length*2-1;
  var box=document.getElementById("msgs");
  Array.prototype.slice.call(box.querySelectorAll(":scope>.b")).forEach(function(n){n.remove();});
  edit(false);
  c.forEach(function(m,i){
    var tt=((t+i*2)%1440+1440)%1440;
    box.appendChild(mk(m[0],m[1],null,pad(Math.floor(tt/60))+":"+pad(tt%60)));
  });
  tails();
  box.style.display="flex";
}

var stage=document.getElementById("stage"),msgsBox=document.getElementById("msgs"),fileIn=document.getElementById("file"),picSide="in";
var PLAY='<svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z"/></svg>';
var VID='<svg viewBox="0 0 16 11"><rect x="0" y="0.5" width="11" height="10" rx="2"/><path d="M12 4l4-2.5v8L12 7z"/></svg>';
function mk(side,text,img,tm,isVid){
  var d=document.createElement("div");d.className="b "+side+(img?" pic":"");
  var h='<em class="x" contenteditable="false">×</em>';
  if(img&&isVid){h+='<div class="md"><video playsinline muted preload="metadata"></video></div><div class="pl">'+PLAY+'</div><div class="du">'+VID+'<span class="dt">0:00</span></div>';}
  else if(img){h+='<div class="md"><img alt=""></div>';}else{h+='<span class="t">'+String(text).replace(/</g,"&lt;")+'</span>';}
  h+='<i><span class="tm">'+tm+'</span>'+(side=="out"?TICKS:"")+'</i>';
  d.innerHTML=h;
  if(img&&isVid){
    var v=d.querySelector("video");v.src=img+"#t=0.1";
    v.addEventListener("loadedmetadata",function(){var t=Math.round(v.duration)||0;d.querySelector(".dt").textContent=Math.floor(t/60)+":"+pad(t%60);});
    v.addEventListener("ended",function(){d.classList.remove("playing");v.muted=true;v.currentTime=0.1;});
    d.addEventListener("click",function(e){
      if(stage.classList.contains("edit")||e.target.closest(".x"))return;
      if(v.paused){v.muted=false;v.play();d.classList.add("playing");}else{v.pause();d.classList.remove("playing");}
    });
  }else if(img)d.querySelector("img").src=img;
  return d;
}
function tails(){
  var k=msgsBox.querySelectorAll(":scope>.b");
  for(var i=0;i<k.length;i++){
    var nx=k[i+1];
    k[i].classList.toggle("tail",!nx||nx.classList[1]!=k[i].classList[1]);
  }
}
function nextTime(){
  var k=msgsBox.querySelectorAll(":scope>.b"),last=k.length?k[k.length-1].querySelector(".tm"):null;
  var src=last?last.textContent:document.getElementById("time").textContent;
  var m=/(\d{1,2}):(\d{2})/.exec(src);
  var v=m?(parseInt(m[1],10)*60+parseInt(m[2],10)+1)%1440:0;
  return pad(Math.floor(v/60))+":"+pad(v%60);
}
function edit(on){
  stage.classList.toggle("edit",on);
  var els=document.querySelectorAll(".t,.tm,#title");
  for(var i=0;i<els.length;i++)els[i].contentEditable=on?"true":"false";
}
function addText(side){
  msgsBox.style.display="flex";
  var d=mk(side,"Message",null,nextTime());
  msgsBox.appendChild(d);tails();edit(true);
  var t=d.querySelector(".t");t.focus();
  var rg=document.createRange();rg.selectNodeContents(t);
  var sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);
}
document.getElementById("plushit").addEventListener("click",function(){edit(!stage.classList.contains("edit"));});

  if(a=="done"){edit(false);return;}
  var p=a.split("-");
  if(p[1]=="text"){addText(p[0]);}

});
fileIn.addEventListener("change",function(){

    msgsBox.style.display="flex";
    msgsBox.appendChild(mk(picSide,"",src,nextTime(),isV));
    tails();edit(true);
  }
  if(f.type.indexOf("video")==0){put(URL.createObjectURL(f),true);}
  else{var rd=new FileReader();rd.onload=function(){put(rd.result,false);};rd.readAsDataURL(f);}
});
msgsBox.addEventListener("click",function(e){
  var x=e.target.closest&&e.target.closest(".x");

});
stage.addEventListener("keydown",function(e){

});
stage.addEventListener("paste",function(e){

  }
});

});

document.getElementById("title").textContent=pick();
