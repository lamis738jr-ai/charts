#tg{animation:sway 3s ease-in-out infinite alternate}

#end .sr{display:flex;align-items:center;gap:10px;background:#2a2e38;border-radius:24px;padding:11px 20px;font-size:17px;min-width:60%}

#set .v.a{border-color:#f2b632}
#set .tg{font-size:13px;display:flex;gap:8px;align-items:center}
#set small{color:#8a92a3;font-size:12px}
.chartonly #ppl{display:none}.chartonly #cw{background:#fff}

#txt{font:900 clamp(22px,7vw,32px)/1.1 Impact,"Arial Black",sans-serif;text-transform:uppercase;text-align:center;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000}

<script>
const HANDLE="@yourpage";            // shown on the end card
const $=id=>document.getElementById(id), B=21000;let END=88,HB="#d9d9d9";
const fh=v=>{v=(v||"").trim();return v?(v[0]==="@"?v:"@"+v):HANDLE};
let saved="";try{saved=localStorage.getItem("hn")||""}catch(e){}
$("hd").textContent=fh(saved);$("hn").value=saved;
$("hn").oninput=e=>{$("hd").textContent=fh(e.target.value);try{localStorage.setItem("hn",e.target.value.trim())}catch(x){}};

/* ---------- candle data: built from rules, so the POC really is the biggest-volume price ---------- */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function interp(w,i){if(i<=w[0][0])return w[0][1];for(let k=1;k<w.length;k++)if(i<=w[k][0]){const[a,p]=w[k-1],[b,q]=w[k];return p+(q-p)*(i-a)/(b-a||1)}return w[w.length-1][1]}
function mk(r,w,i0,i1,nz,o,vf){const out=[];for(let i=i0;i<=i1;i++){const c=interp(w,i)+(r()-.5)*nz*2;out.push({o,c,h:Math.max(o,c)+r()*nz*.8,l:Math.min(o,c)-r()*nz*.8,v:(.5+r())*vf(i)});o=c}return out}
function build(seed,bear){
  const r=rng(seed),iA=12,iB=40,iT=58,N=84;
  let c=mk(r,[[0,112],[5,108],[12,101],[18,128],[22,150],[34,158],[37,200],[40,238]].map(([i,p])=>[i,B+p]),0,iB,5,B+112,i=>i>=20&&i<=34?2.4:1);
  let lo=1e9,hi=-1e9;for(const k of c){lo=Math.min(lo,k.l);hi=Math.max(hi,k.h)}
  c[iA].l=lo-2;c[iB].h=hi+3;const Lp=c[iA].l,Hp=c[iB].h,nb=30,bs=(Hp-Lp)/nb,vol=Array(nb).fill(0);
  for(let i=iA;i<=iB;i++){const k=c[i],bt=Math.max(k.o,k.c),bb=Math.min(k.o,k.c);
    for(let j=0;j<nb;j++){const a=Lp+j*bs,b=a+bs;vol[j]+=k.v*(Math.max(0,Math.min(b,k.h)-Math.max(a,k.l))+2*Math.max(0,Math.min(b,bt)-Math.max(a,bb)))/(k.h-k.l||1)}}
  let pj=0;vol.forEach((v,j)=>{if(v>vol[pj])pj=j});const poc=Lp+(pj+.5)*bs;
  c=c.concat(mk(r,[[iB,c[iB].c],[48,poc+30],[54,poc+14],[iT,poc+3],[61,poc+28],[64,poc+20],[70,poc+(Hp-poc)*.55],[78,Hp-6],[83,Hp+28]],iB+1,N-1,4.5,c[iB].c,()=>1));
  c[iT].l=Math.min(c[iT].l,poc-2);
  let sc={c,iA,iB,iT,pA:Lp,pB:Hp,poc,vol:vol.slice(),bs,plo:Lp,dir:1,stop:Math.min(c[iT].l,c[iT+1].l)-10,target:Hp};
  if(bear){const K=Lp+Hp,f=p=>K-p;
    sc.c=c.map(k=>({o:f(k.o),c:f(k.c),h:f(k.l),l:f(k.h),v:k.v}));
    sc.pA=f(Lp);sc.pB=f(Hp);sc.poc=f(poc);sc.vol.reverse();sc.dir=-1;sc.target=sc.pB;
    sc.stop=Math.max(sc.c[iT].h,sc.c[iT+1].h)+10;}
  sc.lo=Math.min(...sc.c.map(k=>k.l))-8;sc.hi=Math.max(...sc.c.map(k=>k.h))+22;
  sc.R=Math.abs(sc.target-sc.poc)/Math.abs(sc.poc-sc.stop);
  return sc}
const S=[build(7,false),build(23,true)];
/* schedules (seconds, relative to the scene start) */
Object.assign(S[0],{t0:0,rev:[[0,0],[7,41],[33,41],[39,58],[40.5,60],[43.5,66],[47,66],[53,85]],sh:7.5,sl:9.5,sent:12.5,buy:15.8,m0:20,hl:22.2,vp0:24.5,vp1:29,poc0:30.5,pos:43.6,res:50.5});
Object.assign(S[1],{t0:56,rev:[[0,41],[13,41],[18,59],[19.5,64],[21,66],[26,85]],sent:1.2,buy:4,m0:5.5,hl:7.2,vp0:8.8,vp1:11.5,poc0:12.2,pos:19.8,res:24.2});

/* ---------- captions: [time, who(t=teacher,s=student), text] ---------- */
const CAP=[[2.7,'t','Market structure'],[4,'t','higher highs'],[5.6,'s','okay'],[7.6,'t','Swing high'],[8.8,'t','right here'],[10,'t','Swing low'],[11.2,'s','got it'],[12.8,'t','Sentiment is'],[14.2,'t','bullish'],[15.8,'t','Look for buys'],[18,'t',"Where's the entry?"],[19.6,'s','hmm'],[20.6,'t','Open the menu'],[22.4,'t','Fixed range'],[23.6,'t','volume profile'],[25,'t','Drag low to high'],[27.4,'s','yeah'],[28.6,'t','Longest bar'],[30.6,'t',"That's the PoC"],[32.2,'t','Most volume'],[34,'t','Now wait'],[35.4,'t','for the pullback'],[37.5,'t','Price returns'],[38.8,'t','to the PoC'],[40.6,'t','Excellent'],[42,'t','The reaction'],[44,'t','Enter long'],[45.6,'t','Stop below'],[47.2,'t','Target: the high'],[51,'t','Target hit'],[52.6,'s','wow'],[55.2,'t',"We're bearish"],[57.2,'t','Sentiment down'],[59.8,'t','Look for sells'],[61.2,'s','got it'],[62.2,'t','Same menu'],[63.6,'t','Fixed range'],[65.6,'t','Drag high to low'],[67.4,'t','Mark the PoC'],[69.6,'t','Wait'],[70.6,'t','for the pullback'],[73.6,'s','okay'],[74.8,'t','Price returns'],[76.2,'t','Enter short'],[78,'t','Stop above'],[79.8,'t','Target hit'],[81.6,'s','nice'],[83.4,'t','Follow for more'],[85,'t','strategies']];

/* ---------- chart ---------- */
const cw=$("cw"),cv=$("cv"),ctx=cv.getContext("2d");let W=0,H=0;
function resize(){const d=devicePixelRatio||1;W=cw.clientWidth;H=cw.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);frame(T)}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),pg=(t,a,b)=>clamp((t-a)/(b-a)),ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,lerp=(a,b,t)=>a+(b-a)*t;
function ns(r){const e=10**Math.floor(Math.log10(r)),f=r/e;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*e}
const RED="#e0252f";
function halo(txt,x,y,col,font,al){ctx.font=font;ctx.textAlign=al||"left";ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle=HB;ctx.strokeText(txt,x,y);ctx.fillStyle=col;ctx.fillText(txt,x,y)}
function arrow(x1,y1,x2,y2,col,w){const a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-11*Math.cos(a-.45),y2-11*Math.sin(a-.45));ctx.lineTo(x2-11*Math.cos(a+.45),y2-11*Math.sin(a+.45));ctx.closePath();ctx.fill()}
let CP={show:0,x:0,y:0};
function draw(sc,ts){
  HB="#d9d9d9";ctx.fillStyle="#d9d9d9";ctx.fillRect(0,0,W,H);
  const c=sc.c,N=c.length,AX=58,PT=26,PB=22,pr=W-AX,bw=(pr-16)/(N+5),d=sc.dir;
  const X=i=>8+(i+.5)*bw,Y=p=>PT+(sc.hi-p)/(sc.hi-sc.lo)*(H-PT-PB);
  const st=ns((sc.hi-sc.lo)/9);ctx.lineWidth=1;
  for(let p=Math.ceil(sc.lo/st)*st;p<=sc.hi;p+=st){const y=Math.round(Y(p))+.5;ctx.strokeStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(pr,y);ctx.stroke();ctx.font="13px -apple-system,Arial,sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillStyle="#222";ctx.fillText(p.toFixed(2),pr+5,y)}
  for(let i=0;i<N;i+=12){const x=Math.round(X(i))+.5,m=30+i;ctx.strokeStyle="rgba(255,255,255,.4)";ctx.beginPath();ctx.moveTo(x,PT-8);ctx.lineTo(x,H-PB);ctx.stroke();ctx.fillStyle="#222";ctx.font="12px -apple-system,Arial,sans-serif";ctx.textAlign="center";ctx.fillText(String(9+Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"),x,H-PB+12)}
  halo("NQ  1m",10,13,"#1a1a1a","600 15px -apple-system,Arial,sans-serif");
  const n=interp(sc.rev,ts),A=[X(sc.iA),Y(sc.pA)],Bp=[X(sc.iB),Y(sc.pB)];
  const hl=(p,i0,pgr,col,w,dash)=>{if(pgr<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);const y=Math.round(Y(p))+.5,x0=X(i0);ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+(pr-x0)*pgr,y);ctx.stroke();ctx.restore()};
  /* swing lines (behind candles) */
  if(sc.sh!=null){hl(sc.pB,sc.iB,ease(pg(ts,sc.sh,sc.sh+1.2)),RED,1.5);hl(sc.pA,sc.iA,ease(pg(ts,sc.sl,sc.sl+1.2)),RED,1.5)}
  /* volume profile */

  p4pill(W/2-4*k,py,"BUY",UPG,pa*(.5+.5*buy),k);p4pill(W/2+58*k,py,"SELL",DNR,pa*(.5+.5*sel),k);
  /* confirmation tags sit inside the empty green target box, then leave before the rally */
  const tf=1-pg(s,107.2,107.9);p4lab("Strong bullish candle",X(73),Y(E+R*1.1),"#facc15",pg(s,102.8,103.3)*tf,k,"center");p4lab("bos on lower timeframe",X(73),Y(E+R*1.7),"#facc15",pg(s,104.6,105.1)*tf,k,"center");
  if(th>0.01){ctx.save();ctx.translate(W/2,py);ctx.scale(Math.max(.01,th),Math.max(.01,th));ctx.fillStyle="rgba(21,128,61,.95)";ctx.shadowColor=UPG;ctx.shadowBlur=14*k;rr(-W*.27,-15*k,W*.54,30*k,15*k);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font="900 "+Math.round(13.5*k)+"px"+FN;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("TARGET ACHIEVED  +3R",0,1);ctx.restore()}
  /* camera-style overlay: corners + 4K label at the bottom so it never sits behind the caption */
  const ov=pg(s,.15,.6)*(1-pg(ct,P4C1+.4,P4C1+1.2));
  if(ov>0){ctx.save();ctx.globalAlpha=ov;ctx.strokeStyle="#fff";ctx.lineWidth=3*k;ctx.lineCap="square";const m=12*k,L=22*k;
    [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,dx,dy])=>{ctx.beginPath();ctx.moveTo(x+dx*L,y);ctx.lineTo(x,y);ctx.lineTo(x,y+dy*L);ctx.stroke()});
    const by=H-m-30*k;ctx.lineWidth=1.4*k;rr(W-m-40*k,by,24*k,11*k,2.5*k);ctx.stroke();ctx.fillStyle="#fff";ctx.fillRect(W-m-38*k,by+2*k,16*k,7*k);ctx.fillRect(W-m-16*k,by+3.5*k,2*k,4*k);
    ctx.fillStyle="#fff";ctx.font="800 "+Math.round(10*k)+"px"+FN;ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText("4K  60FPS",m+8*k,by+5.5*k);ctx.restore()}
  /* 3-2-1 ring: parked in the empty top-left of the chart so the candles stay readable */
  const ck=pg(ct,P4C0-.3,P4C0)*(1-pg(ct,P4C1,P4C1+.4));
  if(ck>0){const sec=clamp(ct-P4C0,0,2.999),n=3-Math.floor(sec),fr=sec%1,cx=W*.27,cy=H*.32,r=W*.11;ctx.save();ctx.globalAlpha=ck;ctx.shadowColor="#fff";ctx.shadowBlur=12*k;ctx.strokeStyle="rgba(255,255,255,.22)";ctx.lineWidth=6*k;ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.stroke();
    ctx.strokeStyle="#fff";ctx.lineCap="round";ctx.beginPath();ctx.arc(cx,cy,r,-1.5708,-1.5708+6.283*(1-fr));ctx.stroke();ctx.restore();gtxt(String(n),cx,cy+2,"#fff","900 "+Math.round(r*1.2)+"px"+FN,ck,10*k)}
  /* captions: small white sentence case, TOP of the screen */
  if(capsOn){let ci=-1;for(let i=0;i<P4T.length;i++)if(P4T[i][0]<=ct)ci=i;
    if(ci>=0){const a=pg(ct-P4T[ci][0],0,.25);wrapTxt(P4T[ci][1],W/2,H*.075+(1-a)*4*k,W*.84,19*k,"500 "+Math.round(15*k)+"px"+FN,"#fff",a)}}
  ltxt($("hd").textContent,W/2,H-12*k,"#7d828c","600 "+Math.round(11*k)+"px"+FN,.75,"center");
}
function frameP4(t){drawP4(P4U(t),t);if(cap.textContent!==""){cap.textContent="";cap.className=""}
  $("end").classList.toggle("on",t>=122+SH4);$("sc").value=Math.round(t*10)}
LS.push({n:"Candle patterns, Part 4",d:"Liquidity grab: sweep, rejection, long with 3R",end:126+SH4,start:0,mode:"c"});
const P4=LS.length-1;
const _fr4=frame;frame=function(t){if(L===P4){frameP4(t);return}_fr4(t)};
const _cl4=capList;capList=function(){if(L!==P4)return _cl4();
  const a=P4T.map(c=>({t:c[0],who:"t",text:c[2]}));a.splice(1,0,{t:P4C0,who:"t",text:"",silent:true,delay:350});return a};   /* gate: no countdown until "three seconds" has been said */

/* ===== countdown sounds: a tick per number, an alarm at zero ===== */
var SPDOV=0,CATCH=0;let AC=null,lastCD=-1;
function beep(f,d,type,vol,when){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const t0=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(vol||.25,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
let cdL=-1;
function cdLoop(){
  if(cdL!==L){cdL=L;lastCD=-1}
  const cfg=L===P1?[CD0,CD1,5]:(L===P2?[D0,D1,4]:(L===P3?[P3C0,P3C1,5]:(L===P4?[P4C0,P4C1,3]:null)));
  if(cfg){const c0=cfg[0],c1=cfg[1],N=cfg[2];SPDOV=(T>=c0-.001&&T<c1)?1:((L===P2||L===P3||L===P4)&&CATCH?4:0);
    const key=T<c0?-1:(T>=c1?N:Math.floor(T-c0));
    if(key!==lastCD){
      if(playing){
        if(key>=0&&key<N&&key===lastCD+1){beep(620+key*70,.14,"sine",.3);beep(310+key*35,.14,"triangle",.18)}        /* tick, rising */
        if(key===N&&lastCD===N-1){[0,.2,.4].forEach(w=>beep(880,.15,"square",.22,w));beep(440,.5,"sawtooth",.12,.6)}}   /* alarm */
      lastCD=key}}
  else{SPDOV=0}
  requestAnimationFrame(cdLoop)}
requestAnimationFrame(cdLoop);

/* ===== draw sounds: a swish for lines and zones, a pop for arrows, a chime for the trade box, a tick for every new candle ===== */
function noiseBurst(dur,f0,f1,vol,when){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
  const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type="bandpass";f.Q.value=2.5;const t0=AC.currentTime+(when||0);
  f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t0)}catch(e){}}
const SFX={hl:()=>noiseBurst(.45,400,3200,.5),ln:()=>noiseBurst(.4,500,2800,.45),poly:()=>noiseBurst(.6,300,1800,.4),zone:()=>noiseBurst(.5,300,1600,.45),cur:()=>noiseBurst(.5,600,2600,.45),
  arr:()=>{beep(520,.1,"triangle",.35);beep(780,.14,"triangle",.3,.08)},dot:()=>beep(900,.1,"sine",.35),txt:()=>beep(1400,.06,"sine",.18),
  pos:()=>{[523,659,784].forEach((f,i)=>beep(f,.25,"sine",.3,i*.09))},pill:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.32,"triangle",.32,i*.1))}};
const P4EV=[[8.8,"arr"],[13.5,"ln"],[17.8,"hl"],[21,"txt"],[21,"arr"],[25.2,"arr"],[33.2,"arr"],[40,"zone"],[44,"hl"],[44.4,"dot"],[48,"txt"],[52.5,"zone"],[57.2,"cur"],[64.6,"arr"],[68.6,"dot"],[73,"arr"],[77,"txt"],[81,"txt"],[85,"txt"],[90,"zone"],[94,"ln"],[98,"zone"],[102.8,"txt"],[104.6,"txt"],[113.7,"pill"]].map(e=>[e[0]+SH4,e[1]]);
function sfxEvents(){if(L>=3&&L<P1)return G[L-3].ann.map(a=>[a.t,a.k]);if(L===P4)return P4EV;return[]}
function candleCount(){if(L>=3&&L<P1)return Math.floor(interp(G[L-3].rev,T));if(L===P4){const u=P4U(T);let n=0;for(let i=0;i<=80;i++)if(P4R(i)<=u)n++;return n}return 0}
let sfxPT=0,sfxL=-1,sfxN=0;
function sfxLoop(){if(sfxL!==L){sfxL=L;sfxPT=T;sfxN=candleCount()}
  const dt=T-sfxPT;
  if(playing&&dt>0&&dt<.6){sfxEvents().forEach(e=>{if(e[0]>sfxPT&&e[0]<=T&&SFX[e[1]])SFX[e[1]]()});
    const cn=candleCount();if(cn>sfxN&&cn-sfxN<4)beep(1700+(cn*53)%400,.03,"square",.07);sfxN=cn}
  else sfxN=candleCount();
  sfxPT=T;requestAnimationFrame(sfxLoop)}
requestAnimationFrame(sfxLoop);
