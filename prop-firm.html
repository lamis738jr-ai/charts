<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Summary</title>
<style>
:root{--bg:#0d0d10;--panel:#131317;--card:#101014;--line:#222227;--seg:#18181c;--on:#26262c;--text:#f4f4f6;--mute:#7a7a82;--dim:#55555c;--g:#2fd286;--gd:#1e5a43;--gbg:#0e2a20;--blue:#4c9aff;--amber:#f0b429}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{height:100dvh;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
body{background:#050506;color:var(--text);font-family:"Inter",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;align-items:center;-webkit-text-size-adjust:100%}
.app{width:100%;max-width:393px;height:100%;position:relative;overflow:hidden;background:var(--bg)}
.app{height:min(100%,852px);border-radius:34px;border:1px solid #2a2a30}
.scroll{height:100%;overflow-y:auto;padding:44px 12px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ctr{text-align:center}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;margin:8px 0 18px}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mute);letter-spacing:.06em;margin-bottom:14px}
.bar b{color:var(--text);font-size:14px}
.ic{width:17px;height:17px;flex:none;color:#8a8a92}.bar .ic{width:15px;height:15px}.bar.cred{height:39px;font-size:13px;color:var(--text);font-weight:600;letter-spacing:0;cursor:pointer}
.plat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:34px}
.plat button{height:41px;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:12px;font:inherit;font-size:15px;font-weight:600;color:#d6e4ff;cursor:pointer;background:linear-gradient(90deg,#0f0f13 35%,#142238)}
.plat img,.plat svg,.plat .tx{width:24px;height:24px;object-fit:contain;border-radius:6px;font-size:20px;line-height:24px;text-align:center;display:block}
.plogo{width:40px;height:40px;display:grid;place-items:center;background:#18181c;border-radius:10px}.plogo svg,.plogo img{width:26px;height:26px;object-fit:contain}
.plogo .tx{font-size:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 12px;margin-bottom:12px}
.lbl{font-size:9px;letter-spacing:.12em;color:#6b6b73;margin:4px 4px 8px}
.seg{display:flex;align-items:center;background:#101013;border:1px solid #1d1d22;border-radius:10px;padding:4px;height:36px}
.seg.t{justify-content:space-between;padding:4px 6px}.seg.t button{flex:none;padding:0 11px;height:26px;font-size:12px;font-weight:500;color:#8a8a92}.seg.t button.on{background:#222226;color:#fff;font-weight:700;box-shadow:0 0 0 1px #2a2a2f}
.seg button{flex:1;height:27px;border:0;border-radius:8px;background:none;color:var(--mute);font:inherit;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--on);color:var(--text)}
.srow{display:flex;align-items:center;gap:6px;margin-top:8px}.srow .lbl{margin:0;flex:none;width:44px}.srow .seg{flex:1}
.srow .seg button{font-size:13px}
.manage{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--mute);font-size:13px;padding:14px 0 6px;border-top:1px solid var(--line);margin-top:10px}
.acct{background:var(--card);border:1px solid var(--gd);border-radius:16px;padding:18px 17px 17px;margin-bottom:14px}
.t1{display:flex;align-items:center;gap:9px}
.t1 h3{font-size:18px;font-weight:700;letter-spacing:-.005em;white-space:nowrap}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;background:#222226;border-radius:6px;padding:6px 9px;color:#d4d4d8}
.logos{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;font-style:italic}
.logos .lg{display:grid;place-items:center;width:18px;height:18px}.logos img,.logos svg{width:18px;height:18px;object-fit:contain;border-radius:5px;display:block}.logos .ed{cursor:pointer}.logos .tx{font-size:15px;line-height:18px;font-style:normal}
.aid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);margin:12px 0 10px 2px}
.active{display:inline-block;background:var(--gbg);border:1px solid var(--gd);color:var(--g);font-size:11.5px;font-weight:500;border-radius:6px;padding:4px 9px}
.elig{display:flex;align-items:center;gap:12px;color:var(--g);font-weight:600;font-size:14px;min-height:150px;padding:0 24px;border-top:1px solid #15151a;margin-top:12px}
.coin{flex:none;width:25px;height:25px;border-radius:50%;border:1.5px solid var(--gd);background:var(--gbg);display:grid;place-items:center;font-size:12px;font-weight:700}
.elig.off{color:var(--mute)}.elig.off .coin{border-color:#33333a;background:#18181c}
.btn{display:block;width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:#1b1b1f;color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn+.btn{margin-top:9px}
.btn.g{background:var(--gbg);border:1.5px solid var(--gd);color:var(--g);box-shadow:0 0 0 3px #0e2a2055}
.btn:disabled{opacity:.45;cursor:default}
.nav{position:absolute;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:76px;background:#101014f0;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;display:flex;justify-content:space-around;align-items:center}
.nav button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;width:64px}
.nav button.on{color:var(--text)}
.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}
.nav .plus{width:28px;height:28px;border-radius:8px;border:1px solid var(--gd);background:var(--gbg);display:grid;place-items:center;color:var(--g);font-size:18px;line-height:1}
.nav button.add{color:var(--g)}
.ver{display:flex;align-items:center;gap:8px;width:max-content;margin:0 auto 20px;height:36px;padding:0 14px;border-radius:8px;background:var(--gbg);border:1px solid var(--gd);color:var(--g);font-size:12px;font-weight:600}
.card{background:var(--panel);border:1px solid #1b1b20;border-radius:18px;padding:16px 14px 14px;margin-bottom:14px}
.ch{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;margin:0 4px}
.ch s{text-decoration:none;color:var(--g);font-size:17px;width:18px;text-align:center}
.ch em{margin-left:auto;font-style:normal;font-size:12px;width:25px;height:25px;display:grid;place-items:center;border-radius:7px;background:#1f1f24;color:var(--text)}
.pi{background:#101014;border:1px solid #19191e;border-radius:12px;padding:14px;margin-top:14px}
.pi .h{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #19191e}
.pi .id{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:600}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:7px 10px;border-radius:6px;background:var(--gbg);color:var(--g)}
.tag.p{background:#2a2210;color:var(--amber)}.tag.d{background:var(--gbg)}
.kv{display:flex;gap:70px;padding:14px 4px}.kv small{display:block;font-size:9px;letter-spacing:.1em;color:var(--mute);margin-bottom:6px}.kv b{font-size:14px;font-weight:500}.kv b.m{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.sol{display:block;width:100%;height:39px;border:0;border-radius:8px;background:linear-gradient(180deg,#36d68a,#25c17a);color:#06150d;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.sol:disabled{background:#1b1b20;color:#4a4a51;cursor:default}
.demo{display:block;text-align:center;font-size:11px;color:var(--dim);margin-top:10px;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:22px 10px 8px;font-size:12px}
.modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;padding:16px;z-index:5}
.modal.show{display:flex}
.sheet{width:100%;background:#131317;border:1px solid #1f1f25;border-radius:16px;max-height:94%;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sh{padding:18px 19px 14px;border-bottom:1px solid #1b1b20}
.sh h2{font-size:16px;font-weight:600}.sh .id{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--dim);margin-top:5px}
.sb{padding:15px 19px 18px}
.avail{background:#0f2a22;border:1px solid var(--gd);border-radius:10px;text-align:center;padding:16px 0 15px}
.avail small{display:block;font-size:11px;letter-spacing:.07em;color:var(--g);font-weight:600}
.avail b{display:block;margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:23px;color:var(--g);font-weight:700}
.fl{font-size:12px;letter-spacing:.08em;color:#9a9aa2;font-weight:600;margin:20px 0 9px}
.fr{display:flex;justify-content:space-between;align-items:center;margin:16px 0 9px}.fr .fl{margin:0}
.max{height:23px;padding:0 10px;border-radius:6px;border:1px solid var(--gd);background:var(--gbg);color:var(--g);font:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer}
select,.inp{width:100%;height:42px;background:#151519;border:1px solid #26262b;border-radius:9px;color:var(--text);font:inherit;font-size:15px;padding:0 14px}
.inp{display:flex;align-items:center;height:49px;gap:10px}.inp:focus-within{border-color:var(--gd)}
.inp span{color:var(--mute);font-size:18px}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700}
.inp input::placeholder{color:#3c3c43;font-weight:400}
.pb{height:3px;background:transparent;margin-top:8px;border-radius:2px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--g);transition:width .15s}
.mm{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:7px}
.act{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:22px}
.rq{height:40px;padding:0 34px;border:0;border-radius:8px;background:var(--g);color:#06150d;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.rq:disabled{background:#1d1d21;color:#4c4c53;cursor:default}
.cx{height:42px;padding:0 36px;border-radius:8px;border:1px solid #26262b;background:#1c1c20;color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.dlg{width:100%;background:#131317;border:1px solid #1f1f25;border-top:4px solid var(--blue);border-radius:16px;overflow:hidden}
.dh{display:flex;align-items:center;gap:14px;padding:18px 18px 12px}
.dh .ic{width:44px;height:44px;border-radius:50%;background:#14233a;border:1.5px solid var(--blue);display:grid;place-items:center;color:var(--blue);font-weight:700}
.dh h2{font-size:17px;font-weight:600}
.dh .x{margin-left:auto;width:38px;height:38px;border-radius:9px;border:1px solid #26262b;background:#1b1b20;color:var(--mute);font-size:16px;cursor:pointer}
.dbody{padding:10px 18px 22px;font-size:14px;color:#c9c9cf}
.df{display:flex;justify-content:flex-end;padding:14px 18px;border-top:1px solid #1b1b20}
.ok{height:40px;padding:0 30px;border:0;border-radius:8px;background:var(--blue);color:#06101e;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

function nav(){$("#nav").innerHTML=[["accounts","Accounts",I.accounts],["add","Add",'<span class="plus">+</span>'],["payouts","Payouts",I.payouts],["vault","Vault",I.vault],["more","More",I.more]]
 .map(([k,l,i])=>`<button class="${tab==k?"on":""} ${k=="add"?"add":""}" data-t="${k}">${i}${l}</button>`).join("");
 document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});}
function render(){nav();const v=$("#view");v.scrollTop=0;
 v.innerHTML=tab=="accounts"?acctHTML():tab=="payouts"?payHTML():stub();bind();}
function acctHTML(){
 const T=[["evals","LucidEvals"],["funded","LucidFunded"],["direct","LucidDirect"],["live","LucidLive"],["all","All"]];
 const list=(typeF=="funded"||typeF=="all")&&statusF!="breached"?accts:[];
 return `<div class="ctr"><h1>Account Summary</h1><p class="sub">Manage and monitor your trading accounts</p></div>
 <div class="bar">NICKNAME: <b>${CFG.nick}</b> <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg></div>
 <div class="bar cred"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Show Credentials</div>
 <div class="plat">${plats.map((p,i)=>`<button data-pl="${i}">${logo(p)}<span>${esc(p.name)}</span></button>`).join("")}</div>
 <div class="panel"><div class="lbl">TYPE</div><div class="seg t">${T.map(([k,l])=>`<button class="${typeF==k?"on":""}" data-type="${k}">${l}</button>`).join("")}</div>
 <div class="srow"><span class="lbl">STATUS</span><div class="seg">${["active","breached","all"].map(k=>`<button class="${statusF==k?"on":""}" data-st="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div></div>
 <div class="manage"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Manage Accounts</div></div>
 ${list.length?list.map(card).join(""):'<div class="empty">No accounts match these filters.</div>'}`;}
function card(a){const e=a.payout=="eligible";
 return `<div class="acct"><div class="t1"><h3>${CFG.plan}</h3><span class="badge">FUNDED</span><div class="logos"><span class="lg ed" data-side="l">${logo(sideLogo("l"))}</span><span class="lg">${logo(plats[1])}</span><span class="lg ed" data-side="r">${logo(sideLogo("r"))}</span></div></div>
 <div class="aid">${a.id}</div><span class="active">Active</span>
 <div class="elig ${e?"":"off"}"><span class="coin">$</span><span>${e?"You’re eligible to request a payout!":"Payout "+(a.payout=="requested"?"pending review":"completed")}</span></div>
 <button class="btn g" data-req="${a.id}" ${e?"":"disabled"}>Request Payout</button><button class="btn" data-tab="payouts">View Details</button></div>`;}
function payHTML(){
 const open=accts.filter(a=>a.payout!="paid");
 return `<div class="ctr"><h1>Payouts</h1><p class="sub" style="margin-bottom:16px">Manage your payout requests and view history</p></div>
 <div class="ver"><span>✓</span>Verified</div>
 <div class="card"><div class="ch"><s>$</s>Payout Requests${open.length?`<em>${open.length}</em>`:""}</div>
 ${open.length?open.map(a=>{const e=a.payout=="eligible";return `<div class="pi"><div class="h"><span class="id">${a.id}</span><span class="tag ${e?"":"p"}">${e?"ELIGIBLE":"PENDING"}</span></div>
 <div class="kv"><div><small>TYPE</small><b>Flex</b></div><div><small>${e?"MAX PAYOUT":"REQUESTED"}</small><b class="m">$${(e?CFG.max:a.amount).toFixed(2)}</b></div></div>
 <button class="sol" data-req="${a.id}" ${e?"":"disabled"}>Request Payout</button></div>`}).join(""):'<div class="empty">No payout requests.</div>'}</div>
 <div class="card"><div class="ch"><s style="font-size:16px">◷</s>Payout History</div>
 ${hist.map(h=>`<div class="pi"><div class="h"><span class="id">${h.id}</span><span class="tag d">PAID</span></div><div class="kv"><div><small>TYPE</small><b>Flex</b></div><div><small>PAID</small><b class="m">$${h.amount.toFixed(2)}</b></div></div></div>`).join("")}</div>`;}
function setHTML(){const ist='font-family:inherit;font-size:15px;font-weight:500';
 return `<div class="ctr"><h1>Settings</h1><p class="sub">Account size, payout limits and bank</p></div>
 <div class="panel" style="padding:12px 14px 16px"><div class="lbl">ACCOUNT SIZE</div>
 <div class="seg t" style="justify-content:space-around">${[50,100,150].map(n=>`<button class="${SET.size==n?"on":""}" data-size="${n}">${n}K</button>`).join("")}</div>
 <div class="fl">MAX PAYOUT ($)</div><div class="inp" style="height:42px"><input id="smax" inputmode="decimal" value="${SET.max}" style="${ist}"></div>
 <div class="fl">MIN PAYOUT ($)</div><div class="inp" style="height:42px"><input id="smin" inputmode="decimal" value="${SET.min}" style="${ist}"></div>
 <div class="fl">BANK NAME</div><div class="inp" style="height:42px"><input id="sbank" value="${esc(SET.bank)}" style="${ist}"></div>
 <button class="btn g" id="srefresh" style="margin-top:18px">↻ Refresh (restart payouts)</button>
 <button class="btn" id="spaid" style="margin-top:9px">Mark as paid</button><button class="btn" id="sreset" style="margin-top:9px">Reset to defaults</button></div>`;}
function stub(){if(tab=="more")return setHTML();const t={add:["Add account","Choose an evaluation size and platform to start. (Placeholder screen)"],vault:["Vault","Rewards and perks for funded traders. (Placeholder screen)"],more:["More","Settings, verification and support. (Placeholder screen)"]}[tab];
 return `<div class="ctr"><h1>${t[0]}</h1><p class="sub">${t[1]}</p></div>`;}
function bind(){
 document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{typeF=b.dataset.type;render()});
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{statusF=b.dataset.st;render()});
 document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{SET.size=+b.dataset.size;SET.max=DEFSET.max*SET.size/DEFSET.size;SET.min=DEFSET.min*SET.size/DEFSET.size;applySet();saveSet();render()});
 const num=(el,k)=>{if(!el)return;el.onchange=()=>{const v=parseFloat(String(el.value).replace(/[^0-9.]/g,""));if(isFinite(v)&&(k=="min"?v>=0:v>0)){SET[k]=v;applySet();saveSet()}el.value=SET[k]}};
 if($("#sbank"))$("#sbank").onchange=e=>{const v=e.target.value.trim();SET.bank=v||DEFSET.bank;e.target.value=SET.bank;applySet();saveSet()};
 num($("#smax"),"max");num($("#smin"),"min");
 if($("#srefresh"))$("#srefresh").onclick=()=>{accts.forEach(a=>{a.payout="eligible";a.amount=0});hist=[];typeF="funded";statusF="all";tab="accounts";render()};
 if($("#spaid"))$("#spaid").onclick=()=>{accts.filter(a=>a.payout=="requested").forEach(a=>{a.payout="paid";hist.unshift({id:a.id,amount:a.amount})});tab="payouts";render()};
 if($("#sreset"))$("#sreset").onclick=()=>{SET={...DEFSET};applySet();saveSet();render()};
 document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>editPl(+b.dataset.pl));
 document.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>editSide(b.dataset.side));
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 document.querySelectorAll("[data-req]").forEach(b=>b.onclick=()=>openReq(b.dataset.req));
 document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>{const a=accts.find(x=>x.id==b.dataset.paid);a.payout="paid";hist.unshift({id:a.id,amount:a.amount});render()});}
function openReq(id){cur=accts.find(a=>a.id==id);
 $("#modal").innerHTML=`<div class="sheet"><div class="sh"><h2>Request Payout</h2><div class="id">${cur.id}</div></div><div class="sb">
 <div class="avail"><small>AVAILABLE FOR PAYOUT</small><b>${usd(CFG.max)}</b></div>
 <div class="fl">BANK ACCOUNT</div><select id="bank"><option value="">Select an account</option><option>${CFG.bank}</option><option value="new">Add a new bank</option></select>
 <div class="fr"><span class="fl">REQUEST AMOUNT</span><button class="max" id="max">MAX</button></div>
 <div class="inp"><span>$</span><input id="amt" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
 <div class="pb"><i id="pb"></i></div><div class="mm"><span>Min: $${CFG.min}</span><span id="pc"></span></div>
 <div class="act"><button class="rq" id="go" disabled>Request $0.00</button><button class="cx" id="cx">Cancel</button></div></div></div>`;
 $("#modal").classList.add("show");
 const amt=$("#amt"),bank=$("#bank"),go=$("#go");
 const val=()=>Math.min(parseFloat(amt.value)||0,CFG.max);
 const upd=()=>{const v=val(),p=v/CFG.max*100;$("#pb").style.width=v?p+"%":"0";$("#pc").textContent=v?Math.round(p)+"% of available":"";
  go.textContent="Request "+usd(v);go.disabled=!(bank.value&&bank.value!="new"&&v>=CFG.min);};
 amt.oninput=()=>{amt.value=amt.value.replace(/[^0-9.]/g,"");if(parseFloat(amt.value)>CFG.max)amt.value=CFG.max;upd()};
