${S.notifs.map(n=>`<div class="nt"><div class="av">${esc(ini(n.n))}</div><div><b>New Payment 💰</b><span class="tx">${T("ln"+n.id,n.n+" just paid $"+n.a)}</span></div><small>now</small><button class="xs" data-act="del:notifs:${n.id}" style="position:absolute;right:8px;bottom:6px;padding:2px 7px">×</button></div>`).join("")}<div class="pk"></div><button class="add" data-act="add:notifs" style="color:#fff;border-color:#fff">+ Add notification</button></div>`}

const sheet=h=>{$("#sh").innerHTML=h;$("#ov").classList.add("on")},closeS=()=>$("#ov").classList.remove("on");
function createSheet(){const keys="123456789.0⌫".split("");
 sheet(`<div class="sh-h"><span>${I.doc}</span><b>Create checkout link</b><span class="xb" data-act="x">${I.close}</span></div><div class="amt"><span>$</span>${esc(cr.amt||"0")}</div>
 <div class="pr"><select id="per" aria-label="Billing"><option>One-time payment</option><option>Recurring payment 7d</option><option>Recurring payment 30d</option><option>Recurring payment 365d</option></select><span class="pill" data-act="more" style="border:0">•••</span></div>

const H={
 go(v){view=v;render();$("#scr").scrollTop=0},edit(){edit=!edit;render()},x:closeS,metric(m){S.m=m;anim=true;save();render()},inline(){edit=true;view="home";render()},sel(id){S.sel=+id;save();render()},tile(i){if(i==0)H.go("pays");if(i==1)H.go("links")},
 logo(){$("#fi").click()},chart(){chartSheet()},mk(){createSheet()},more(){const t=$("#ttl");if(t)cr.title=t.value;cr.more=!cr.more;createSheet()},
 key(k){const t=$("#ttl");if(t)cr.title=t.value;if(k==="⌫")cr.amt=cr.amt.slice(0,-1);else if(k!=="."||!cr.amt.includes("."))cr.amt=(cr.amt==="0"?"":cr.amt)+k;createSheet()},
 chartgo(){const a=$("#cv").value.split(",").map(x=>num(x));while(a.length<12)a.push(0);S.chart=a.slice(0,12);save();closeS();render()},
 mkgo(){const t=$("#ttl");if(t)cr.title=t.value;const id=S.nid++;S.products.push({id,type:cr.per});S.t["pt"+id]=cr.title||"New product";S.t["ps"+id]=cr.per;S.t["pp"+id]=money(num(cr.amt));S.t["pl"+id]=cr.per;save();closeS();view="links";render()},
 del(type,id){S[type]=S[type].filter(x=>x.id!=id);save();render()},
 add(type){const id=S.nid++;S[type].push(type==="notifs"?{id,n:"newbuyer",a:"25.00"}:{id});save();render()},
 buy(){const p=S.products.find(x=>x.id===S.sel)||S.products[0],d=DP[p.id]||{},amt=num(val("pp"+p.id,d.p)),title=val("pt"+p.id,d.t);const name=["alexr","jordanm","sam_k","tayloreb","morganp"][Math.floor(Math.random()*5)]+Math.floor(Math.random()*90);
  const add=(k,a)=>{const v=num(val(k))+a;S.t[k]=money(v);return v};const g=add("v_gross",amt);S.t.d_gross="+"+money(num(val("d_gross"))+amt);S.t.earned=money(g)+" earned";S.t.users=(num(val("users"))+1)+" users";
  if(/recurring/i.test(p.type||"")){const m=add("v_mrr",amt);S.t.v_arr=money(m*12);S.t.d_mrr="+"+money(num(val("d_mrr"))+amt);S.t.d_arr="+"+money(m*12)}
  S.chart[S.chart.length-1]+=amt;const id=S.nid++;S.notifs.unshift({id,n:name,a:amt.toFixed(2)});save();render();banner(`<b>New Payment 💰</b><br>${esc(name)} just paid ${money(amt)} for ${esc(title)}`)}};
const allowed=["go","edit","logo","chart","add","del","x"];
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const[f,...p]=a.dataset.act.split(":");if(edit&&!allowed.includes(f))return;if(e.target.closest("[data-k]")&&edit&&f!=="go")return;H[f]&&H[f](...p)});
document.addEventListener("input",e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){S.t[f]=e.target.value;save();return}
const k=e.target.closest("[data-k]");if(k){S.t[k.dataset.k]=k.textContent;save()}});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.f;if(!k)return;let v=e.target.value.trim();const n=num(v);
 if(/^v_/.test(k))v=money(n);else if(/^d_/.test(k))v="+"+money(n);else if(k==="earned"&&/^[\d$,.\s]+$/.test(v))v=money(n)+" earned";else if(k==="users"&&/^\d+$/.test(v))v=n+(n==1?" user":" users");
 S.t[k]=v;e.target.value=v;save()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest("[data-k]")){e.preventDefault();e.target.blur()}if(e.key==="Escape")closeS()});
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeS()});
$("#sh").addEventListener("change",e=>{if(e.target.id==="per")cr.per=e.target.value});
$("#fi").onchange=()=>{const f=$("#fi").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);S.logo=c.toDataURL("image/png");save();render()};im.src=r.result};r.readAsDataURL(f)};

/* chart scrub */
(function(){const cw=()=>$("#cw");let on=false;
 const show=e=>{const el=cw();if(!el||!CH)return;const b=el.getBoundingClientRect(),x=Math.max(0,Math.min(b.width,e.clientX-b.left)),n=CH.c.length,i=Math.round(x/b.width*(n-1)),p=CH.P[i],px=p[0]/CH.W*b.width,py=p[1]/CH.H*b.height;
  const to=new Date(),sd=Date.parse(val("from")),ed=Date.parse(val("to")),end=isNaN(ed)?to:new Date(ed),st=isNaN(sd)?new Date(end-320*864e5):new Date(sd),d=new Date(+st+(end-st)*i/(n-1));
  const dot=el.querySelector(".dot"),tt=el.querySelector(".tt");dot.hidden=tt.hidden=false;dot.style.left=px+"px";dot.style.top=py+"px";
  tt.firstChild.textContent=fmtD(d);tt.lastChild.textContent="Value: "+money(CH.c[i]);tt.style.left=Math.max(0,Math.min(b.width-tt.offsetWidth,px-tt.offsetWidth/2))+"px"};
 const hide=()=>{on=false;const el=cw();if(el)el.querySelectorAll(".dot,.tt").forEach(x=>x.hidden=true)};
 document.addEventListener("pointerdown",e=>{if(e.target.closest("#cw")){on=true;show(e)}});
 document.addEventListener("pointermove",e=>{if(!e.target.closest||!e.target.closest("#cw")){if(e.pointerType==="mouse"&&!on)hide();return}if(on||e.pointerType==="mouse")show(e)});
 document.addEventListener("pointerup",hide);document.addEventListener("pointercancel",hide);
 document.addEventListener("mouseleave",hide);
})();
/* pull to refresh */
(function(){const sc=$("#scr"),pt=$("#ptr");let y0=null,pull=0,busy=false;
 const set=(y,a)=>{sc.style.transition=a?"transform .3s":"none";sc.style.transform=y?`translateY(${y}px)`:"";pt.style.transition=a?"all .3s":"none";pt.style.opacity=Math.min(1,y/40);pt.style.transform=`translate(-50%,${Math.max(0,y/2-15)}px)`;if(!busy)pt.firstElementChild.style.transform=`rotate(${y*5}deg)`};
 const ok=t=>!edit&&view!=="lock"&&!busy&&sc.scrollTop<=0&&!(t.closest&&t.closest("input,select,[contenteditable=true],.cw"));
 const start=(y,t)=>{y0=ok(t)?y:null;pull=0};
 const move=y=>{if(y0===null)return false;const d=y-y0;if(d<=0||sc.scrollTop>0){if(pull){pull=0;set(0,true)}return false}pull=Math.min(120,d*.5);set(pull);return true};
 const end=()=>{if(y0===null)return;y0=null;if(pull>=60){busy=true;set(64,true);pt.classList.add("spin");pt.firstElementChild.style.transform="";setTimeout(()=>{pt.classList.remove("spin");busy=false;anim=true;render();set(0,true)},1100)}else set(0,true);pull=0};
 sc.addEventListener("touchstart",e=>start(e.touches[0].clientY,e.target),{passive:true});
 sc.addEventListener("touchmove",e=>{if(move(e.touches[0].clientY)&&e.cancelable)e.preventDefault()},{passive:false});
 sc.addEventListener("touchend",end);sc.addEventListener("touchcancel",end);
 sc.addEventListener("mousedown",e=>start(e.clientY,e.target));
 window.addEventListener("mousemove",e=>{if(e.buttons)move(e.clientY)});window.addEventListener("mouseup",end);
})();
render();
