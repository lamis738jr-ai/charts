<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Chart</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#05070b; --panel:#0e1117; --panel2:#171b24; --line:#262b36;
  --text:#e9ecf1; --muted:#8a92a3; --gold:#f2b632;
  --green:#4caf50; --green-btn:#4c9f50; --red:#e0453d; --red-btn:#c9433b;
  --chart:#d9d9d9;
}
:root:not([data-theme="light"]){ color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;}
button,select,input{font:inherit;color:inherit;}
#app{height:100%;width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);
  border-left:1px solid #12151c;border-right:1px solid #12151c;position:relative;overflow:hidden;}

/* top account strip */
.top{display:flex;gap:6px;padding:6px;align-items:stretch;}
.acct{flex:1.5;min-width:0;border:1.5px solid #fff;border-radius:8px;background:#0a0d12;padding:0 10px;height:42px;
  display:flex;align-items:center;gap:6px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;cursor:pointer;text-align:left}
.acct small{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;flex:1}
.acct .car{color:var(--text);font-size:11px}
.pl{flex:1;border:1px solid var(--line);background:#0a0d12;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13.5px;white-space:nowrap;height:42px;padding:0 6px}
.pl span{margin-left:4px}
.up{color:var(--green)} .dn{color:var(--red)}

/* symbol row */
.sym{display:flex;align-items:center;height:44px;padding:0 6px;border-bottom:1px solid #12151c;gap:2px}
.sym select{background:transparent;border:0;outline:0;font-weight:700;font-size:16px;appearance:none;-webkit-appearance:none;padding:6px 8px;cursor:pointer;max-width:92px}
.sym select option{background:#171b24}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.ib{background:transparent;border:0;color:var(--text);padding:6px 9px;cursor:pointer;font-size:15px;border-radius:6px;display:flex;align-items:center;gap:6px}
.ib:active{background:var(--panel2)}
.spacer{flex:1}
.sym{overflow:hidden}.sym>*{flex:none}
.deco{color:var(--text);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:14px;white-space:nowrap;cursor:default;user-select:none}
.dsep{width:1px;height:22px;background:var(--line);margin:0 2px}
.cbx{width:20px;height:20px;border:1.5px solid #8a92a3;border-radius:4px;margin-left:6px}
.replay{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:12px}
.replay button{background:var(--panel2);border:0;border-radius:6px;color:var(--text);width:30px;height:28px;cursor:pointer}

/* chart */
#wrap{position:relative;flex:1;min-height:200px;background:var(--chart);margin:0 0 0 0;touch-action:none;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#head{position:absolute;left:14px;top:8px;pointer-events:none;color:#1a1a1a;z-index:2;text-shadow:0 0 6px #d9d9d9}
#head .t{font-size:19px;font-weight:600;letter-spacing:.1px}
#head .p{font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.zoom{position:absolute;left:10px;bottom:34px;display:flex;gap:6px;z-index:3}
.zoom button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:17px;cursor:pointer}
#pick{position:absolute;left:8px;right:8px;top:62px;background:rgba(14,17,23,.96);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;display:none;z-index:4;font-size:12.5px;color:var(--text)}
#pick .r1{color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
#pick .r2{display:flex;gap:6px;align-items:center}
#pick button{border:0;border-radius:7px;padding:8px 10px;font-weight:700;cursor:pointer}
#pick .b{background:var(--green-btn);color:#fff} #pick .s{background:var(--red-btn);color:#fff}
#pick .x{background:var(--panel2);color:var(--text);margin-left:auto}

/* position bar */
.posbar{display:flex;align-items:center;gap:8px;padding:8px 8px;background:var(--bg);border-top:1px solid #12151c}
.chip{background:var(--panel2);border-radius:6px;padding:7px 10px;font-weight:600;font-size:13.5px;white-space:nowrap}
.chip.dim{color:#b9bfcc;font-weight:500}
.pos-state{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbtn{border:1.5px solid #8a6a1c;background:#12100a;border-radius:7px;padding:7px 10px;display:flex;align-items:center;gap:6px;
  font-weight:600;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap}
.gbtn.on{border-color:var(--gold);color:#fff}
.qty{display:flex;align-items:center;justify-content:center;gap:11px;padding:9px 8px;border-top:1px solid #12151c;background:#0a0d12}
.qty button.q{width:30px;height:30px;border-radius:50%;border:1.5px solid #8a6a1c;background:transparent;color:var(--text);font-size:14px;cursor:pointer;padding:0}
.qty button.q.a{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;font-weight:700;color:#fff}
.qty .pen{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;margin-left:6px}
.trade{display:flex;gap:6px;padding:8px 8px 10px;align-items:stretch;background:#0a0d12}
.tb{border:0;border-radius:6px;font-weight:800;font-size:17px;color:#fff;padding:0 12px;min-width:100px;cursor:pointer;height:50px}
.tb.buy{background:var(--green-btn)} .tb.sell{background:var(--red-btn)}
.tb:active{filter:brightness(1.15)}
.px{flex:1;display:flex;gap:4px;min-width:0}
.px .bid,.px .ask{flex:1;border:1px solid #2a6a32;border-radius:5px;padding:4px 7px;font-size:12px;color:var(--muted);min-width:0}
.px .ask{border-color:#6e2a27;text-align:right}
.px b{display:block;color:var(--text);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.px .mid{display:none}
@media(min-width:420px){.px .mid{display:block;text-align:center;font-size:12px;color:var(--muted);align-self:center;min-width:60px}
 .px .mid b{font-size:16px}}
.tabs{display:flex;border-top:1px solid #12151c;background:#0a0d12}
.tabs div{flex:1;text-align:center;padding:12px 0;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.3px}
.tabs div.on{color:var(--gold);box-shadow:0 -2px 0 var(--gold) inset}
.tabs .rp{flex:2.4;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs .rl{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--gold)}
.tabs .replay{flex:none;padding:0;display:flex;align-items:center;gap:4px}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#10141b;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  z-index:10;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:86%;overflow:auto;
  transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -12px 40px rgba(0,0,0,.6)}
.sheet.open{transform:none}
.sheet h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center}
.sheet h3 button{margin-left:auto;background:var(--panel2);border:0;border-radius:7px;padding:6px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.f input,.f select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;outline:0;font-variant-numeric:tabular-nums}
.f input:focus,.f select:focus{border-color:var(--gold)}
.f select option{background:#171b24}
.full{grid-column:1/-1}
.stepper{display:flex;gap:6px}
.stepper button{width:44px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button,.act button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:13px}
.chips button.hl{border-color:var(--gold);color:#fff}
.hint{color:var(--muted);font-size:12px;line-height:1.4}
.result{background:#0a0d12;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.result .big{font-size:22px;font-weight:800}
.act{display:flex;gap:8px;flex-wrap:wrap}
.btn-i{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000c;color:#fff;border-radius:20px;padding:8px 14px;font-size:13px;
  z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
body{display:flex;align-items:center;justify-content:center}
.replay button.go{width:auto;padding:0 12px;background:var(--gold);color:#111;font-weight:700}
.replay button.spd{width:38px}
.replay button[hidden]{display:none}
@media(max-width:440px){.sep{display:none}.sym select{padding:6px 4px;max-width:80px}.ib{padding:6px 7px}.replay button{width:28px}.replay button.go{width:auto}.replay button.spd{width:36px}}
@media(min-width:500px){#app{height:min(100%,900px);border-radius:22px;border:1px solid #1d2230}}
.acct,.pl,.sym select,.chip,.gbtn,.tb,#head .t,.tabs div,.qty button.q.a,.sheet h3,.result .big,.replay button.go,#pick button{font-weight:400}
.pl,.sym select,#symChip{font-weight:700}
.badge{position:absolute;right:8px;top:8px;z-index:3;font-size:10px;font-weight:700;letter-spacing:.6px;color:#333;background:#0000001c;border-radius:5px;padding:3px 6px;pointer-events:none}

/* tradingview-style skin */
:root{--gold:#2962ff;--green-btn:#2962ff;--red-btn:#f23645}
.acct{color:#6f98ff;border-color:#2962ff}
.tb.buy{background:#2962ff;order:3}.tb.sell{background:#f23645;order:-1}
.px{order:1}
.qty button.q,.gbtn{border-color:#2f4a8f}
.qty button.q.a{border-color:#2962ff;box-shadow:0 0 0 1px #2962ff inset}
.replay button.go{color:#fff}
.tabs{background:#000}
.tabs div{color:#e9ecf1}
.tabs .rl{color:#6f98ff}
#pick .b{background:#2962ff}#pick .s{background:#f23645}

/* closer to the reference layout: full-screen chart, floating controls */
.top,.sym,.qty,.posbar{display:none}
#app{background:#d9d9d9}
.trade{position:absolute;left:10px;top:60px;z-index:5;background:transparent;padding:0;gap:4px;align-items:stretch}
.trade .px{display:none}
.tb{height:42px;min-width:86px;font-size:15px;line-height:1.15;padding:2px 10px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tb small{font-size:10px;letter-spacing:.5px;opacity:.9}
.tb.buy{order:3}.tb.sell{order:-1}
.qchip{order:0;display:flex;align-items:center;justify-content:center;min-width:52px;background:#fff;border:1px solid #c9ccd4;color:#111;border-radius:6px;font-size:16px;cursor:pointer;user-select:none}
#pick{top:112px}
.jump{position:absolute;right:90px;bottom:34px;z-index:3;width:44px;height:40px;border:0;border-radius:8px;background:#111;color:#fff;font-size:22px;line-height:1;cursor:pointer}
#tbSym,#tbTf{font-size:17px;color:#fff;cursor:pointer}
#tbPen,#tbMore{font-size:20px;color:#fff;cursor:pointer}
.tabs{border-top:0}
.tabs .rl{font-size:10px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="acct" id="acct"><span>PAPER</span><small>| PRACTICE-SIM</small><span class="car">▼</span></div>
    <div class="pl">RP&amp;L:<span id="rp">$0.00</span></div>
    <div class="pl">UP&amp;L:<span id="upl">$0.00</span></div>
  </div>

  <div class="sym">
    <span class="deco"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg></span><select id="symSel" aria-label="Instrument"></select>
    <div class="sep"></div>
    <select id="tfSel" aria-label="Timeframe">
      <option selected>1m</option><option>5m</option><option>15m</option><option>1h</option><option>4h</option><option>1D</option>
    </select>
    <div class="sep"></div>
    <button class="ib" id="importBtn" title="New chart">⟳</button><div class="dsep"></div><span class="deco"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2v3M5 12v3M13 4v2M13 13v3"/><rect x="3" y="5" width="4" height="7" rx=".6"/><rect x="11" y="6" width="4" height="7" rx=".6"/></svg></span><div class="dsep"></div><span class="deco" style="font-style:italic;font-family:Georgia,serif;font-size:19px">ƒ<small style="font-size:10px;font-style:normal;margin-left:1px">x</small></span><div class="dsep"></div><span class="deco"><span style="color:var(--muted);font-size:17px">⚙︎</span>Preferences</span><span class="cbx"></span>
    <input type="file" id="file" accept=".csv,.txt" hidden>
    <div class="spacer"></div>
    
  </div>

  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="head"><div class="t" id="title"></div><div class="p" id="ohlc"></div></div>
    
    <div class="zoom"><button id="zOut">−</button><button id="zIn">+</button></div>
    <div id="pick">
      <div class="r1" id="pickInfo"></div>
      <div class="r2"><button class="b" id="pickBuy">Buy here</button><button class="s" id="pickSell">Sell here</button><button class="x" id="pickX">✕</button></div>
    </div>
  </div>

  <div class="posbar">
    <div class="chip" id="symChip">MNQZ26</div>
    <div class="chip dim pos-state" id="posState">No Active Position</div>
    <button class="gbtn on" id="editBtn" title="Edit">✎</button>
  </div>
  <div class="qty" id="qtyRow">
    <button class="q" data-d="-1">−</button>
    <button class="q" data-q="1">1</button><button class="q" data-q="3">3</button><button class="q a" data-q="5">5</button>
    <button class="q" data-q="10">10</button><button class="q" data-q="15">15</button>
    <button class="q" data-d="1">+</button>
  </div>
  <div class="trade">
    <button class="tb buy" id="buy">BUY +5</button>
    <div id="qtyChip" class="qchip">⌄ 5</div>
    <div class="px">
      <div class="bid">Bid:<b id="bid">–</b></div>
      <div class="mid"><b id="mid">–</b>spread</div>
      <div class="ask">Ask:<b id="ask">–</b></div>
    </div>
    <button class="tb sell" id="sell">SELL -5</button>
  </div>
  <div class="tabs"><div id="tbSym">MNQ1!</div><div id="tbTf">1m</div><div class="rp"><span class="rl">SAMPLE DATA · REPLAY</span><div class="replay"><button id="rBack" title="Back one candle">◀</button><button id="rPlay" class="go" title="Replay">⏵</button><button id="rFwd" title="Forward one candle">▶</button><button id="rSpd" class="spd" title="Replay speed">1x</button><button id="rEnd" hidden>⏭</button></div></div><div id="tbPen">✎</div><div id="tbMore">•••</div></div>

  <!-- edit sheet -->
  <div class="sheet" id="sheet">
    <h3>Position <button id="sheetDone">Done</button></h3>
    <div id="noTrade" class="hint" style="display:none">No trade yet. Tap a candle on the chart and choose Buy here / Sell here, or place a market order.</div>
    <div id="tradeForm" class="grid">
      <div class="f"><label>Side</label><select id="fSide"><option value="1">Long</option><option value="-1">Short</option></select></div>
      <div class="f"><label>Contracts</label><input id="fQty" type="number" min="1" step="1" inputmode="numeric"></div>

      <div class="f full"><label>Entry candle</label>
        <div class="stepper"><input id="fEntryT" readonly><button id="eIdxM" title="Earlier candle">◀</button><button id="eIdxP" title="Later candle">▶</button></div></div>
      <div class="f full"><label>Entry price</label>
        <div class="stepper"><input id="fEntry" type="number" step="0.25" inputmode="decimal"><button id="eM">−</button><button id="eP">+</button></div></div>
      <div class="full chips">
        <button id="eHigh" class="hl">Top tick (candle high)</button>
        <button id="eLow" class="hl">Bottom tick (candle low)</button>
        <button id="eOpen">Open</button><button id="eClose">Close</button>
      </div>

      <div class="f full"><label>Exit price (leave empty to keep trade open)</label>
        <div class="stepper"><input id="fExit" type="number" step="0.25" inputmode="decimal" placeholder="open"><button id="xM">−</button><button id="xP">+</button></div></div>
      <div class="f full"><label>Exit candle</label>
        <div class="stepper"><input id="fExitT" readonly placeholder="–"><button id="xIdxM">◀</button><button id="xIdxP">▶</button></div></div>
      <div class="full chips"><button id="xHigh">Exit at high</button><button id="xLow">Exit at low</button><button id="xMkt">Close at market</button></div>

      <div class="f full"><label>Take profit</label><div class="stepper"><input id="fTP" type="number" step="0.25" inputmode="decimal" placeholder="none"><button id="tM">−</button><button id="tP">+</button></div></div>
      <div class="f full"><label>Stop loss</label><div class="stepper"><input id="fSL" type="number" step="0.25" inputmode="decimal" placeholder="none"><button id="sM">−</button><button id="sP">+</button></div></div>
      <div class="full chips"><button id="tpslAdd">Add TP / SL</button><button id="tpslOff">Remove TP / SL</button></div>
      <div class="full hint" id="rangeHint"></div>
      <div class="full result"><div><div class="hint" id="resSub"></div></div><div class="big" id="resBig">$0.00</div></div>
      <div class="full act"><button id="clearTrade">Clear trade</button></div>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script>
(function(){
"use strict";
/* ---------- instruments ---------- */
var INST={
  MNQ:{name:"Micro Nasdaq",code:"MNQ1!",pv:2,tick:0.25,base:31100,vol:70},
  NQ:{name:"E-mini Nasdaq",code:"NQ1!",pv:20,tick:0.25,base:31100,vol:70},
  MES:{name:"Micro E-mini S&P 500",code:"MES1!",pv:5,tick:0.25,base:6900,vol:14},
  ES:{name:"E-mini S&P 500",code:"ES1!",pv:50,tick:0.25,base:6900,vol:14},
  MYM:{name:"Micro E-mini Dow",code:"MYM1!",pv:0.5,tick:1,base:46500,vol:90}
};
var TF_MS={"1m":6e4,"5m":3e5,"15m":9e5,"1h":36e5,"4h":144e5,"1D":864e5};
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- state ---------- */
var sym="MNQ", tf="1m", candles=[], cursor=0, imported=false;
var full=[], salt="", formIdx=-1, formStep=0, formPath=[], timer=null, speed=1, hits=[];
var barW=6, right=0;
var pos=null, realized=0, qtyN=5, picked=null;
var tick=0.25, pv=2;

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function snap(p){return Math.round(p/tick)*tick;}
function fmt(p){return p.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money(v){var s=v<0?"-":(v>0?"+":"");return s+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function two(n){return (n<10?"0":"")+n;}
function tstr(t){var d=new Date(t);return MON[d.getMonth()]+" "+d.getDate()+" "+two(d.getHours())+":"+two(d.getMinutes());}
function clampIdx(i){return Math.max(0,Math.min(cursor,i));}
function clampPrice(p,idx){var c=candles[idx];return snap(Math.min(c.h,Math.max(c.l,p)));}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},2200);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){var u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ---------- data ---------- */
function generate(){
  var I=INST[sym]; tick=I.tick; pv=I.pv;
  var ms=TF_MS[tf], n=500, seedStr=sym+tf+salt, seed=0;
  for(var i=0;i<seedStr.length;i++) seed=(seed*31+seedStr.charCodeAt(i))|0;
  var r=mulberry(seed), vol=I.vol*Math.sqrt(ms/36e5);
  var end=Math.floor(Date.now()/ms)*ms, px=I.base, out=[];
  for(var k=0;k<n;k++){

function placeHere(sd){
  if(!picked)return; bank();
  var idx=picked.idx; pos={side:sd,qty:qtyN,entryIdx:idx,entry:clampPrice(picked.price,idx),exit:null};
  picked=null; showPick(); syncUI(); openSheet();
}

/* ---------- interaction ---------- */
var drag=null;
cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId);
  var r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, mode="pan";
  var hh=hitAt(x,y);
  if(hh&&hh.zone==="body"){ if(hh.k==="entry")mode="entry"; else if(pos&&!pos.exit)mode=hh.k; }
  else if(!hh&&pos&&x<W-AX){
    if(!pos.exit&&pos.tp&&Math.abs(y-yOf(pos.tp))<11)mode="tp";
    else if(!pos.exit&&pos.sl&&Math.abs(y-yOf(pos.sl))<11)mode="sl";
    else if(Math.abs(y-yOf(pos.entry))<11)mode="entry";
  }
  drag={x:x,y:y,right0:right,moved:false,mode:mode};
});
cv.addEventListener("pointermove",function(e){
  if(!drag)return;
  var r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(Math.abs(x-drag.x)>4||Math.abs(y-drag.y)>4) drag.moved=true;
  if(!drag.moved)return;
  if(drag.mode==="tp"){ pos.tp=snap(pOf(y)); syncUI(); }
  else if(drag.mode==="sl"){ pos.sl=snap(pOf(y)); syncUI(); }
  else if(drag.mode==="entry"){ pos.entry=clampPrice(pOf(y),pos.entryIdx); syncUI(); }
  else{ right=drag.right0-(x-drag.x)/barW; right=Math.max(8,Math.min(candles.length+6,right)); draw(); }
});
cv.addEventListener("pointerup",function(e){
  if(!drag)return;
  var d=drag; drag=null;
  if(d.moved)return;
  var th=hitAt(d.x,d.y); if(th){ pillTap(th); return; }
  var idx=clampIdx(idxOf(d.x)), price=snap(pOf(d.y));
  picked={idx:idx,price:clampPrice(price,idx)};
  showPick(); draw();
});
cv.addEventListener("wheel",function(e){e.preventDefault();zoom(e.deltaY<0?1.12:0.89);},{passive:false});
function zoom(f){barW=Math.max(4,Math.min(44,barW*f));draw();}
$("zIn").onclick=function(){zoom(1.25);}; $("zOut").onclick=function(){zoom(0.8);};

$("buy").onclick=function(){market(1);}; $("sell").onclick=function(){market(-1);};
$("pickBuy").onclick=function(){placeHere(1);}; $("pickSell").onclick=function(){placeHere(-1);};
$("pickX").onclick=function(){picked=null;showPick();draw();};
$("qtyRow").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  if(b.dataset.q) qtyN=+b.dataset.q; else if(b.dataset.d) qtyN=Math.max(1,qtyN+ +b.dataset.d);
  syncUI();
});
$("editBtn").onclick=openSheet; $("sheetDone").onclick=closeSheet;

$("fSide").onchange=function(){pos.side=+this.value;syncUI();};
$("fQty").onchange=function(){pos.qty=Math.max(1,Math.round(+this.value)||1);syncUI();};
$("fEntry").onchange=function(){setEntry(+this.value);};
$("fExit").onchange=function(){ if(this.value===""){pos.exit=null;syncUI();} else setExit(+this.value); };
$("eM").onclick=function(){setEntry(pos.entry-tick);}; $("eP").onclick=function(){setEntry(pos.entry+tick);};
$("xM").onclick=function(){setExit((pos.exit?pos.exit.price:markPrice())-tick);}; $("xP").onclick=function(){setExit((pos.exit?pos.exit.price:markPrice())+tick);};
$("eHigh").onclick=function(){setEntry(candles[pos.entryIdx].h);}; $("eLow").onclick=function(){setEntry(candles[pos.entryIdx].l);};
$("eOpen").onclick=function(){setEntry(candles[pos.entryIdx].o);}; $("eClose").onclick=function(){setEntry(candles[pos.entryIdx].c);};
$("eIdxM").onclick=function(){moveEntryIdx(-1);}; $("eIdxP").onclick=function(){moveEntryIdx(1);};
$("xIdxM").onclick=function(){moveExitIdx(-1);}; $("xIdxP").onclick=function(){moveExitIdx(1);};
function exitAt(kind){
  if(!pos)return; if(!pos.exit) pos.exit={idx:Math.max(pos.entryIdx,cursor),price:0};
  var c=candles[pos.exit.idx]; pos.exit.price=kind==="h"?c.h:kind==="l"?c.l:c.c; syncUI();
}
$("xHigh").onclick=function(){exitAt("h");}; $("xLow").onclick=function(){exitAt("l");};
$("xMkt").onclick=function(){ if(!pos)return; pos.exit={idx:Math.max(pos.entryIdx,cursor),price:markPrice()}; syncUI(); };
$("fTP").onchange=function(){ if(!pos)return; pos.tp=this.value===""?null:snap(+this.value); syncUI(); };
$("fSL").onchange=function(){ if(!pos)return; pos.sl=this.value===""?null:snap(+this.value); syncUI(); };
$("tM").onclick=function(){ if(!pos)return; pos.tp=snap((pos.tp||pos.entry)-tick); syncUI(); };
$("tP").onclick=function(){ if(!pos)return; pos.tp=snap((pos.tp||pos.entry)+tick); syncUI(); };
$("sM").onclick=function(){ if(!pos)return; pos.sl=snap((pos.sl||pos.entry)-tick); syncUI(); };
$("sP").onclick=function(){ if(!pos)return; pos.sl=snap((pos.sl||pos.entry)+tick); syncUI(); };
$("tpslAdd").onclick=addTPSL;
$("tpslOff").onclick=function(){ if(pos){pos.tp=null;pos.sl=null;syncUI();} };
$("clearTrade").onclick=function(){pos=null;syncUI();};

/* replay */
function settle(){ if(formIdx>=0){candles[formIdx]=full[formIdx];formIdx=-1;} }
function stopPlay(){ if(timer){clearInterval(timer);timer=null;} var b=$("rPlay"); if(b)b.textContent="⏵"; }
function startPlay(){
  stopPlay();
  if(cursor>=full.length-1&&formIdx<0){toast("End of data");return;}
  $("rPlay").textContent="■";
  timer=setInterval(playTick,Math.round(125/speed));
}
function startForm(){
  var idx=cursor+1; if(idx>=full.length) return false;
  var c=full[idx], up=c.c>=c.o, lowFirst=up?Math.random()<0.65:Math.random()>=0.65;
  var w=lowFirst?[c.o,c.l,c.h,c.c]:[c.o,c.h,c.l,c.c], N=16, p1=Math.round(N/3), p2=Math.round(2*N/3), path=[], k, a, b, f, p;
  for(k=1;k<=N;k++){
    if(k<=p1){a=w[0];b=w[1];f=k/p1;} else if(k<=p2){a=w[1];b=w[2];f=(k-p1)/(p2-p1);} else {a=w[2];b=w[3];f=(k-p2)/(N-p2);}
    p=a+(b-a)*f;
    if(k!==p1&&k!==p2&&k!==N){ p+=gauss(Math.random)*(c.h-c.l)*0.035; p=Math.min(c.h,Math.max(c.l,p)); }
    path.push(snap(p));
  }
  path[N-1]=c.c;
  formIdx=idx; formStep=0; formPath=path;
  candles[idx]={t:c.t,o:c.o,h:c.o,l:c.o,c:c.o}; cursor=idx; return true;
}
function advanceForm(){
  var c=candles[formIdx], p=formPath[formStep++];
  c.c=p; if(p>c.h)c.h=p; if(p<c.l)c.l=p;
  if(formStep>=formPath.length){ candles[formIdx]=full[formIdx]; formIdx=-1; }
  right=Math.max(right,Math.min(cursor+4,candles.length+6));
}
function playTick(){
  if(formIdx<0){ if(!startForm()){ stopPlay(); toast("End of data"); return; } }
  var prevPx=candles[cursor].c; advanceForm(); checkExits(prevPx,candles[cursor].c); syncUI();
}
$("rPlay").onclick=function(){ if(timer) stopPlay(); else startPlay(); };
$("rSpd").onclick=function(){
  var s=[0.5,1,2,4]; speed=s[(s.indexOf(speed)+1)%s.length]; this.textContent=speed+"x";
  if(timer) startPlay();
};
$("rBack").onclick=function(){stopPlay();settle();cursor=Math.max(20,cursor-1);fixPos();right=Math.min(right,cursor+4);syncUI();};
$("rFwd").onclick=function(){stopPlay();settle();cursor=Math.min(full.length-1,cursor+1);right=Math.max(right,Math.min(cursor+4,candles.length+6));syncUI();};
$("rEnd").onclick=function(){stopPlay();settle();cursor=full.length-1;right=cursor+4;syncUI();};
function fixPos(){
  if(picked&&picked.idx>cursor){picked=null;showPick();}
  if(pos){ if(pos.entryIdx>cursor){pos=null;} else if(pos.exit&&pos.exit.idx>cursor){pos.exit=null;} }
}

/* instruments / timeframe / import */
Object.keys(INST).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=INST[k].code;$("symSel").appendChild(o);});
function reload(){generate();showPick();syncUI();}
$("symSel").onchange=function(){sym=this.value;reload();};
$("tfSel").onchange=function(){tf=this.value;reload();};
$("importBtn").onclick=function(){salt=String(Math.random());reload();toast("New chart loaded");};
$("file").onchange=function(){
  var f=this.files[0]; if(!f)return; var rd=new FileReader();
  rd.onload=function(){
    var data=parseCSV(String(rd.result));
    if(!data){toast("Couldn't read candles. Need datetime, open, high, low, close.");return;}
    stopPlay();formIdx=-1;candles=data;full=data.slice();imported=true;cursor=candles.length-1;right=cursor+4;pos=null;realized=0;picked=null;
    document.querySelector(".rl").textContent="IMPORTED DATA · REPLAY";
    var t=candles[1].t-candles[0].t; tf=t<=6e4?"1m":t<=3e5?"5m":t<=9e5?"15m":t<=36e5?"1h":t<=144e5?"4h":"1D"; $("tfSel").value=tf;
    // fit tick to data if it looks different
    showPick();syncUI();toast(data.length+" candles loaded from file");
  };
  rd.readAsText(f); this.value="";
};

$("tbSym").onclick=function(){var ks=Object.keys(INST);sym=ks[(ks.indexOf(sym)+1)%ks.length];$("symSel").value=sym;reload();};
$("tbTf").onclick=function(){var a=["1m","5m","15m","1h","4h","1D"];tf=a[(a.indexOf(tf)+1)%a.length];$("tfSel").value=tf;reload();};
$("tbPen").onclick=openSheet;
$("tbMore").onclick=function(){salt=String(Math.random());reload();toast("New chart loaded");};
$("qtyChip").onclick=function(){var a=[1,3,5,10,15];qtyN=a[(a.indexOf(qtyN)+1)%a.length];syncUI();};

new ResizeObserver(resize).observe($("wrap"));
generate(); syncUI(); resize();
})();
</script>
</body>
